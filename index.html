<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍣 Sushi Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#b8e8ff;--sky-bot:#e8f8d0;
  --water:#3aa8d8;--water2:#1a7aaa;--water3:#0d5a8a;
  --grass:#6cc83a;--grass2:#4aa018;--grass3:#2a7008;
  --dirt:#c8883a;--dirt2:#a06018;
  --road:#38384a;--road2:#22222e;
  --sand:#e8d898;--sand2:#c8b868;
  --red:#e8403a;--red2:#b82020;
  --teal:#2abcaa;--teal2:#1a8c7a;
  --gold:#f8c832;--gold2:#c89010;
  --warm:#fff8ee;--ink:#2a1a0e;
  --panel:rgba(255,252,245,0.92);
  --panel-border:rgba(42,26,14,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:#000}
body{font-family:'M PLUS Rounded 1c',sans-serif}

/* ═══════════════════════════════════
   PORTRAIT LOCK
═══════════════════════════════════ */
.portrait-warn{
  display:none;position:fixed;inset:0;z-index:99999;
  background:linear-gradient(160deg,#1a3a50,#0a1a28);
  flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px;
}
@media(orientation:portrait){.portrait-warn{display:flex;}}
.pw-icon{font-size:72px;animation:rp 2s ease-in-out infinite}
@keyframes rp{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
.pw-t{font-family:'Zen Dots',monospace;font-size:22px;color:var(--gold)}
.pw-s{font-size:13px;color:rgba(255,255,255,.5);font-weight:700;line-height:1.7}

/* ═══════════════════════════════════
   SCREEN BASE
═══════════════════════════════════ */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:opacity .3s,transform .3s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.98)}

/* ═══════════════════════════════════
   MAP SCREEN
═══════════════════════════════════ */
#screen-map{
  background:linear-gradient(175deg,#c8eeff 0%,#e8f8f0 45%,#d4f0a8 100%);
  overflow:hidden;
}
.map-header{
  position:relative;z-index:10;
  padding:14px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.map-logo{font-family:'Zen Dots',monospace;font-size:24px;color:var(--red);text-shadow:1px 2px 0 rgba(232,64,58,.18)}
.map-logo-sub{font-size:9px;color:rgba(42,26,14,.38);font-weight:800;letter-spacing:2px;margin-top:1px}
.map-wallet{
  display:flex;align-items:center;gap:7px;
  background:var(--panel);border:2px solid rgba(248,200,50,.45);
  border-radius:28px;padding:6px 16px;
  box-shadow:0 4px 14px rgba(42,26,14,.1);
}
.map-wallet-val{font-family:'Zen Dots',monospace;font-size:19px;color:var(--gold2)}
.map-world{
  position:relative;z-index:10;margin:0 20px 10px;
  background:var(--panel);border:2px solid rgba(42,188,170,.28);
  border-radius:14px;padding:8px 16px;
  box-shadow:0 4px 14px rgba(42,26,14,.08);
  display:flex;align-items:center;gap:10px;
}
.map-world-t{font-family:'Zen Dots',monospace;font-size:12px;color:var(--teal2)}
.map-world-s{font-size:9px;color:rgba(42,26,14,.38);font-weight:800;margin-top:2px}
.map-body{flex:1;display:flex;align-items:center;overflow:hidden;position:relative}
.map-scroll{width:100%;overflow-x:auto;overflow-y:hidden;padding:14px 26px}
.map-scroll::-webkit-scrollbar{display:none}
.levels-row{display:flex;align-items:center;min-width:max-content}
.lv-line{width:44px;height:3px;background:repeating-linear-gradient(90deg,rgba(42,26,14,.18) 0,rgba(42,26,14,.18) 4px,transparent 4px,transparent 9px)}
.lv-wrap{display:flex;flex-direction:column;align-items:center}
.lv-node{
  width:84px;height:84px;border-radius:50%;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:transform .14s;
}
.lv-node:active{transform:scale(.88) translateY(4px)}
.lv-node.done{background:radial-gradient(circle at 38% 32%,#fff,var(--teal),var(--teal2));border:4px solid #fff;box-shadow:0 7px 0 var(--teal2),0 9px 20px rgba(42,188,170,.3),inset 0 2px 0 rgba(255,255,255,.6)}
.lv-node.next{background:radial-gradient(circle at 38% 32%,#fffad0,var(--gold),var(--gold2));border:4px solid #fff;box-shadow:0 7px 0 var(--gold2),0 9px 20px rgba(248,200,50,.35),inset 0 2px 0 rgba(255,255,255,.6);animation:npulse 1.8s ease-in-out infinite}
.lv-node.locked{background:radial-gradient(circle at 38% 32%,#ddd,#aaa,#888);border:4px solid #fff;box-shadow:0 6px 0 #666,inset 0 2px 0 rgba(255,255,255,.3);opacity:.6;cursor:default}
@keyframes npulse{0%,100%{box-shadow:0 7px 0 var(--gold2),0 0 0 0 rgba(248,200,50,.7)}50%{box-shadow:0 7px 0 var(--gold2),0 0 0 16px rgba(248,200,50,0)}}
.lv-num{font-family:'Zen Dots',monospace;font-size:26px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.2);line-height:1}
.lv-stars{display:flex;gap:1px;margin-top:2px}
.lv-stars span{font-size:12px}
.lv-shadow{width:62px;height:9px;background:radial-gradient(ellipse,rgba(0,0,0,.16),transparent);border-radius:50%;margin-top:4px}
.map-deco{position:absolute;bottom:0;left:0;right:0;height:35%;pointer-events:none;z-index:1}
.deco-i{position:absolute;bottom:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1))}
.petal{position:absolute;animation:petal-fall linear infinite;pointer-events:none;z-index:0;opacity:.65}
@keyframes petal-fall{0%{transform:translateX(0) rotate(0);opacity:.65}100%{transform:translateX(70px) rotate(360deg);opacity:0;top:110vh!important}}

/* ═══════════════════════════════════
   GAME SCREEN — TRUE FULLSCREEN
═══════════════════════════════════ */
#screen-game{overflow:hidden;position:relative}

/* ── THE WORLD (fills entire screen) ── */
#world{
  position:absolute;inset:0;
  overflow:hidden;
}

/* Sky */
.world-sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    #7ed4f8 0%,
    #b8eaff 30%,
    #cef5d0 52%,
    #8ed848 52%,
    #60b828 64%,
    #38800a 72%,
    #c88838 72%,
    #a06018 80%,
    #383848 80%,
    #22222e 100%
  );
}

/* Animated sky elements */
.world-sun{
  position:absolute;top:12px;right:60px;width:52px;height:52px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 42% 38%,#fffad0,#ffe050,#ffb000);
  box-shadow:0 0 0 8px rgba(255,220,50,.15),0 0 0 18px rgba(255,210,40,.07),0 0 40px rgba(255,190,0,.4);
  animation:sun-glow 5s ease-in-out infinite;
}
@keyframes sun-glow{0%,100%{box-shadow:0 0 0 8px rgba(255,220,50,.15),0 0 40px rgba(255,190,0,.4)}50%{box-shadow:0 0 0 14px rgba(255,220,50,.22),0 0 60px rgba(255,190,0,.6)}}
.world-cloud{position:absolute;animation:cloud-move linear infinite;pointer-events:none;z-index:3;opacity:.85}
@keyframes cloud-move{from{transform:translateX(-140px)}to{transform:translateX(115vw)}}

/* Water layer with waves */
.water-zone{
  position:absolute;left:0;right:0;z-index:4;
  overflow:hidden;
}
.water-surface{
  position:absolute;inset:0;
  background:linear-gradient(180deg,var(--water) 0%,var(--water2) 50%,var(--water3) 100%);
}
.water-wave{
  position:absolute;top:0;left:-100%;right:-100%;height:8px;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.18) 0,rgba(255,255,255,.18) 40px,
    transparent 40px,transparent 90px
  );
  animation:wave-move 3s linear infinite;
  border-radius:4px;
}
.water-wave:nth-child(2){top:5px;animation-duration:4.5s;animation-delay:-2s;opacity:.6}
.water-wave:nth-child(3){top:10px;animation-duration:3.8s;animation-delay:-1.2s;opacity:.4}
@keyframes wave-move{from{transform:translateX(0)}to{transform:translateX(90px)}}
.water-shimmer{
  position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0,rgba(255,255,255,.06) 2px,transparent 2px,transparent 28px);
  animation:shim 4s linear infinite;
}
@keyframes shim{from{background-position:0 0}to{background-position:56px 0}}

/* Terrain layers */
.terrain-layer{position:absolute;left:0;right:0}

/* Ground fence */
.fence-svg{position:absolute;left:0;right:0;z-index:8;pointer-events:none}

/* ═══════════════════════════════════
   SCENE OBJECTS — positioned absolutely in world
═══════════════════════════════════ */

/* ── PIER ── */
.pier-structure{
  position:absolute;z-index:6;
  display:flex;flex-direction:column;align-items:center;
}
.pier-deck{
  position:relative;
  border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,#c8a050,#a07828,#805808);
  border:2px solid #604008;
  box-shadow:0 4px 0 #402800,0 6px 16px rgba(0,0,0,.3);
}
.pier-deck::before{/* wood planks */
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 14px);
  border-radius:5px 5px 0 0;
}
.pier-deck::after{/* top shine */
  content:'';position:absolute;top:0;left:0;right:0;height:38%;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);
  border-radius:5px 5px 0 0;
}
.pier-post{
  position:absolute;bottom:-20px;
  width:8px;background:linear-gradient(180deg,#a07828,#604008);
  border-radius:0 0 3px 3px;border:1px solid #402800;
}
.pier-water-line{
  width:100%;height:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);
  border-radius:0 0 4px 4px;
}
/* Fisher character on pier */
.fisher-char{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;z-index:10;
  transition:transform .12s;
}
.fisher-char:active{transform:scale(.88)}
.char-body{
  position:relative;display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));
}
.char-emoji{font-size:32px;line-height:1;animation:fisher-idle 3s ease-in-out infinite}
@keyframes fisher-idle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.char-rod{font-size:18px;position:absolute;right:-14px;top:2px;animation:rod-bob 2s ease-in-out infinite}
@keyframes rod-bob{0%,100%{transform:rotate(15deg)}50%{transform:rotate(25deg)}}
.char-cd-ring{
  position:absolute;inset:-5px;border-radius:50%;
  border:3px solid transparent;
  transition:all .2s;
}
.char-cd-ring.active{
  border-color:rgba(42,188,170,.6);
  animation:cd-spin 1s linear infinite;
}
@keyframes cd-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.char-ready-glow{
  position:absolute;inset:-6px;border-radius:50%;
  background:radial-gradient(circle,rgba(248,200,50,.35),transparent 70%);
  animation:ready-pulse .9s ease-in-out infinite;
}
@keyframes ready-pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.3);opacity:.4}}
.char-bubble{
  background:#fff;border:2px solid var(--teal);border-radius:10px;
  padding:2px 8px;font-size:8px;font-weight:800;color:var(--teal2);
  white-space:nowrap;margin-bottom:2px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  animation:bubble-pop .3s ease;
}
@keyframes bubble-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.char-progress{
  width:42px;height:4px;background:rgba(0,0,0,.15);border-radius:3px;overflow:hidden;margin-top:3px;
  border:1px solid rgba(255,255,255,.3);
}
.char-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),#8ae880);border-radius:3px;transition:width .25s linear}
.char-name{font-size:8px;font-weight:800;color:var(--ink);opacity:.55;margin-top:2px;white-space:nowrap}
.lv-badge{
  position:absolute;top:-7px;right:-7px;
  background:linear-gradient(145deg,#fff8d0,var(--gold));
  border:2px solid var(--gold2);border-radius:8px;
  padding:1px 5px;font-size:8px;font-weight:900;color:var(--gold2);
  box-shadow:0 2px 0 rgba(200,144,16,.4);z-index:5;
}

/* ── RICE FIELD ── */
.rice-field{
  position:absolute;z-index:6;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;
}
.field-plot{
  position:relative;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,#78c838,#58a018,#388008);
  border:2.5px solid #285008;
  box-shadow:0 5px 0 #183808,0 7px 16px rgba(0,0,0,.2);
}
.field-plot::before{/* grid lines */
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0,rgba(0,0,0,.06) 1px,transparent 1px,transparent 12px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0,rgba(0,0,0,.06) 1px,transparent 1px,transparent 12px);
}
.field-rice-row{
  position:absolute;bottom:4px;left:0;right:0;
  display:flex;justify-content:space-evenly;
}
.rice-stalk{font-size:14px;animation:rice-sway 2s ease-in-out infinite}
.rice-stalk:nth-child(2){animation-delay:.3s}
.rice-stalk:nth-child(3){animation-delay:.6s}
.rice-stalk:nth-child(4){animation-delay:.9s}
@keyframes rice-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.field-farmer{
  position:absolute;bottom:4px;right:4px;font-size:18px;
  animation:farmer-work 2.5s ease-in-out infinite;
}
@keyframes farmer-work{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}

/* ── AQUARIUM ── */
.aqua-tank{
  position:absolute;z-index:6;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;
}
.tank-body{
  position:relative;border-radius:8px;overflow:hidden;
  background:linear-gradient(165deg,#4ad0f8,#1a9ad8,#0a6898);
  border:3px solid #0a4878;
  box-shadow:0 5px 0 #063060,0 7px 18px rgba(10,72,120,.4);
}
.tank-water{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
}
.tank-bubbles{position:absolute;inset:0}
.tank-bubble{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.55);
  animation:bubble-rise linear infinite;
}
@keyframes bubble-rise{0%{transform:translateY(0) scale(1);opacity:.55}100%{transform:translateY(-60px) scale(.3);opacity:0}}
.tank-fish{position:absolute;animation:fish-swim linear infinite}
@keyframes fish-swim{0%{left:8px;transform:scaleX(1)}49%{left:calc(100% - 28px);transform:scaleX(1)}50%{left:calc(100% - 28px);transform:scaleX(-1)}99%{left:8px;transform:scaleX(-1)}100%{left:8px;transform:scaleX(1)}}
.tank-glass{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2) 0,transparent 50%);
  pointer-events:none;
}

/* ── GARDEN ── */
.garden-plot{
  position:absolute;z-index:6;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;
}
.garden-bed{
  position:relative;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,#88b840,#60880a,#405808);
  border:2.5px solid #284008;
  box-shadow:0 5px 0 #182808,0 7px 14px rgba(0,0,0,.2);
}
.garden-bed::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0,rgba(0,0,0,.04) 2px,transparent 2px,transparent 10px);
}
.garden-plants{
  position:absolute;inset:4px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-items:end;
}
.garden-plant{font-size:14px;text-align:center;animation:plant-grow 3s ease-in-out infinite}
.garden-plant:nth-child(2){animation-delay:.5s}
.garden-plant:nth-child(3){animation-delay:1s}
@keyframes plant-grow{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}

/* ── KITCHEN BUILDING ── */
.kitchen-building{
  position:absolute;z-index:7;
  display:flex;flex-direction:column;align-items:center;
}
/* Roof */
.bld-roof-wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.bld-roof{
  width:0;height:0;
  position:relative;
}
.bld-roof-band{width:100%;border-radius:0 0 4px 4px;border:2px solid rgba(0,0,0,.2);border-top:none}
/* Walls */
.bld-walls{
  width:100%;position:relative;overflow:hidden;
  border:3px solid rgba(0,0,0,.25);border-top:none;
  border-radius:0 0 8px 8px;
}
.bld-walls::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.06) 0,rgba(0,0,0,.06) 1px,transparent 1px,transparent 10px);
}
.bld-walls::after{
  content:'';position:absolute;top:0;left:0;right:0;height:32%;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);
}
.bld-window{
  position:absolute;background:linear-gradient(145deg,#c8e8f8,#88c0e0);
  border:2px solid rgba(0,0,0,.25);border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);z-index:2;
}
.bld-window::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4) 0,transparent 60%);border-radius:2px}
.bld-door{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  border:2px solid rgba(0,0,0,.3);border-radius:4px 4px 0 0;z-index:2;
}
.bld-sign{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.95);border:1.5px solid rgba(0,0,0,.1);
  border-radius:7px;padding:2px 7px;font-size:9px;font-weight:900;color:var(--ink);
  white-space:nowrap;z-index:3;box-shadow:0 2px 4px rgba(0,0,0,.08);
}
.bld-progress{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(0,0,0,.18);z-index:3}
.bld-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),#80e860);transition:width .3s linear}
/* Cook character in window */
.cook-char{
  position:absolute;z-index:4;
  animation:cook-peek 4s ease-in-out infinite;
}
@keyframes cook-peek{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-4px)}}
/* Steam from chimney */
.chimney-obj{position:absolute;top:-18px;width:14px;height:20px;background:linear-gradient(180deg,#888,#555);border-radius:3px 3px 0 0;border:1.5px solid #333}
.steam{
  position:absolute;border-radius:50%;
  background:rgba(220,235,255,.65);
  animation:steam-rise 2s ease-out infinite;
}
@keyframes steam-rise{0%{transform:translateX(-50%) scale(1);opacity:.65}100%{transform:translateX(-50%) scale(3.5);opacity:0;margin-bottom:36px}}
.bld-shadow{
  width:90%;height:10px;margin-top:4px;
  background:radial-gradient(ellipse,rgba(0,0,0,.2),transparent);
  border-radius:50%;
}
.bld-lbl{font-size:9px;font-weight:800;color:rgba(42,26,14,.5);white-space:nowrap;margin-top:2px}
.bld-working{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 3px rgba(42,188,170,.5),0 0 20px rgba(42,188,170,.3)!important}

/* ── DELIVERY MOPED ── */
.moped-obj{
  position:absolute;z-index:9;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;
}
.moped-speech{
  background:#fff;border:2px solid var(--gold);border-radius:12px;
  padding:3px 10px;font-size:9px;font-weight:800;color:var(--gold2);
  box-shadow:0 3px 8px rgba(0,0,0,.1);white-space:nowrap;position:relative;
}
.moped-speech::after{
  content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:7px solid #fff;
}
.moped-vehicle{
  display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.2));
}
.moped-body-svg{font-size:40px;line-height:1}
.moped-obj.moving .moped-body-svg{animation:moped-bounce .25s ease-in-out infinite}
@keyframes moped-bounce{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
.moped-glow .moped-vehicle{filter:drop-shadow(0 0 10px rgba(248,200,50,1)) drop-shadow(0 5px 8px rgba(0,0,0,.2));animation:mglow .6s ease-in-out infinite}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 6px rgba(248,200,50,.8)) drop-shadow(0 5px 8px rgba(0,0,0,.2))}50%{filter:drop-shadow(0 0 16px rgba(248,200,50,1)) drop-shadow(0 5px 8px rgba(0,0,0,.2))}}

/* ═══════════════════════════════════
   FLOATING UI — overlaid on world
═══════════════════════════════════ */
#ui-layer{
  position:absolute;inset:0;pointer-events:none;z-index:20;
  display:flex;flex-direction:column;
}

/* Top bar — minimal floating */
.top-bar{
  pointer-events:all;
  display:flex;align-items:center;gap:8px;
  padding:10px 12px 6px;
}
.tb-back{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.88);border:2px solid rgba(232,64,58,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--red);cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  backdrop-filter:blur(8px);
  transition:transform .12s;
}
.tb-back:active{transform:scale(.88)}
.tb-lvl{
  background:var(--red);border-radius:10px;
  padding:4px 12px;font-family:'Zen Dots',monospace;
  font-size:12px;color:#fff;box-shadow:0 3px 0 var(--red2);flex-shrink:0;
}
/* Steps floating pills */
.tb-steps{flex:1;display:flex;justify-content:center;gap:4px}
.step-pill{
  padding:4px 9px;border-radius:20px;font-size:9px;font-weight:800;
  background:rgba(255,255,255,.72);color:rgba(42,26,14,.35);
  border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(6px);
  transition:all .3s;white-space:nowrap;pointer-events:none;
}
.step-pill.active{background:rgba(248,200,50,.85);color:#8a5800;border-color:rgba(248,200,50,.6);animation:spulse .9s ease-in-out infinite}
.step-pill.done{background:rgba(42,188,170,.8);color:#fff;border-color:rgba(42,188,170,.5)}
@keyframes spulse{0%,100%{opacity:1}50%{opacity:.6}}
.tb-sep{width:1px;height:26px;background:rgba(255,255,255,.4);flex-shrink:0}
/* Stars */
.tb-stars{display:flex;gap:2px;flex-shrink:0}
.tb-star{font-size:18px;filter:grayscale(1) opacity(.3);transition:filter .3s,transform .3s;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.2)) grayscale(1) opacity(.3)}
.tb-star.on{filter:drop-shadow(0 2px 4px rgba(248,200,50,.5));animation:star-pop .4s ease}
@keyframes star-pop{0%{transform:scale(1)}50%{transform:scale(1.9)}100%{transform:scale(1)}}
/* Timer */
.tb-timer{
  background:rgba(30,30,40,.82);border-radius:12px;
  padding:4px 12px;font-family:'Zen Dots',monospace;font-size:14px;color:#fff;
  min-width:74px;text-align:center;flex-shrink:0;
  backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(0,0,0,.2);
}
.tb-timer.red{background:rgba(232,64,58,.9);animation:tblink .5s infinite}
@keyframes tblink{0%,100%{opacity:1}50%{opacity:.5}}
/* Coins */
.tb-coins{
  display:flex;align-items:center;gap:3px;
  background:rgba(255,255,255,.88);border:2px solid rgba(248,200,50,.45);
  border-radius:12px;padding:3px 11px;
  font-size:14px;font-weight:900;color:var(--gold2);
  backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(0,0,0,.1);flex-shrink:0;
}

/* Side panels */
.side-panels{
  flex:1;display:flex;align-items:stretch;pointer-events:none;
  padding:0 8px 10px;gap:8px;min-height:0;
}

/* Orders panel — left */
.orders-panel{
  width:136px;flex-shrink:0;pointer-events:all;
  background:rgba(255,252,245,.9);
  border:2px solid rgba(42,26,14,.08);border-radius:16px;
  display:flex;flex-direction:column;padding:8px 6px;gap:5px;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  overflow:hidden;
}
.panel-title{
  font-family:'Zen Dots',monospace;font-size:9px;color:rgba(42,26,14,.35);
  letter-spacing:1.5px;text-transform:uppercase;text-align:center;
  padding:3px 0 5px;border-bottom:1px solid rgba(42,26,14,.07);
}
.orders-list{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto}
.orders-list::-webkit-scrollbar{display:none}
.order-card{
  background:#fff;border:2.5px solid #f0dfc0;border-radius:12px;
  padding:7px 8px 6px;flex-shrink:0;cursor:pointer;position:relative;
  box-shadow:0 3px 0 rgba(42,26,14,.09),0 4px 12px rgba(42,26,14,.05);
  transition:transform .12s,box-shadow .12s;overflow:hidden;
}
.order-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:12px 12px 0 0}
.order-card:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,26,14,.09)}
.order-card.sel{border-color:var(--teal);box-shadow:0 3px 0 var(--teal2),0 0 0 3px rgba(42,188,170,.2)}
.order-card.ready{border-color:var(--teal);box-shadow:0 3px 0 var(--teal2),0 0 0 3px rgba(42,188,170,.18);animation:card-bob .85s ease-in-out infinite}
@keyframes card-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.oi-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.oi{font-size:20px;transition:filter .2s,opacity .2s}
.oi.dim{filter:grayscale(1);opacity:.2}
.o-reward{font-size:11px;font-weight:900;color:var(--gold2);display:flex;align-items:center;gap:2px}
.o-tbar{height:4px;background:rgba(42,26,14,.08);border-radius:3px;overflow:hidden;margin-top:4px}
.o-tfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),#80e860);transition:width .4s linear,background .4s}
.o-tfill.low{background:linear-gradient(90deg,var(--red),#ff8060)}
.o-ph{border:2px dashed rgba(42,26,14,.1);border-radius:12px;min-height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.18}

/* Spacer middle */
.panel-spacer{flex:1}

/* Kitchen panel — right */
.kitchen-panel{
  width:136px;flex-shrink:0;pointer-events:all;
  background:rgba(255,252,245,.9);
  border:2px solid rgba(42,26,14,.08);border-radius:16px;
  display:flex;flex-direction:column;padding:8px 6px;gap:6px;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  overflow-y:auto;
}
.kitchen-panel::-webkit-scrollbar{display:none}

/* Kitchen card (tappable building proxy) */
.kitchen-card{
  background:#fff;border:2.5px solid rgba(42,26,14,.08);border-radius:12px;
  padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;transition:transform .12s,box-shadow .12s;
  box-shadow:0 3px 8px rgba(0,0,0,.06);position:relative;
}
.kitchen-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:12px 12px 0 0}
.kitchen-card:active{transform:scale(.96)}
.kitchen-card.working{
  border-color:var(--teal);
  box-shadow:0 3px 8px rgba(0,0,0,.06),0 0 0 3px rgba(42,188,170,.2);
}
.kc-icon{font-size:26px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.15))}
.kc-recipe{font-size:10px;font-weight:800;color:rgba(42,26,14,.45);white-space:nowrap}
.kc-name{font-size:9px;font-weight:800;color:rgba(42,26,14,.35);white-space:nowrap}
.kc-prog{width:100%;height:5px;background:rgba(42,26,14,.08);border-radius:3px;overflow:hidden}
.kc-prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),#80e860);transition:width .3s linear}
.kc-lv{position:absolute;top:-6px;right:-6px;background:linear-gradient(145deg,#fffad0,var(--gold));border:2px solid var(--gold2);border-radius:7px;padding:1px 5px;font-size:8px;font-weight:900;color:var(--gold2);box-shadow:0 2px 0 rgba(200,144,16,.3)}

/* Fridge card */
.fridge-card{
  background:linear-gradient(160deg,#e8f8f8,#c8ecea);
  border:2px solid rgba(42,188,170,.3);border-radius:12px;
  padding:6px 8px;
  box-shadow:0 3px 8px rgba(0,0,0,.06);
}
.fridge-title{font-size:9px;font-weight:800;color:var(--teal2);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.fridge-items{display:flex;gap:2px;flex-wrap:wrap}
.fridge-chip{background:#fff;border:1.5px solid rgba(42,188,170,.3);border-radius:8px;padding:2px 5px;font-size:12px;display:flex;align-items:center;gap:1px}
.fridge-chip span{font-size:8px;font-weight:900;color:var(--teal2)}
.fridge-empty{font-size:9px;color:rgba(42,26,14,.25);font-weight:700}

/* ═══════════════════════════════════
   UPGRADE SCREEN
═══════════════════════════════════ */
#screen-upgrade{
  background:linear-gradient(160deg,#fdf6ee,#f0ead8);
  flex-direction:row;overflow:hidden;
}
.upg-left{width:262px;flex-shrink:0;background:rgba(255,255,255,.75);border-right:2px solid rgba(42,26,14,.08);backdrop-filter:blur(12px);display:flex;flex-direction:column;padding:20px;gap:12px}
.upg-hl{font-family:'Zen Dots',monospace;font-size:21px;color:var(--red)}
.upg-stars-row{display:flex;gap:10px;margin:4px 0}
.s-big{font-size:36px;filter:grayscale(1) opacity(.2);transition:filter .3s,transform .3s}
.s-big.on{filter:none;animation:spop .5s ease}
@keyframes spop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
.res-pills{display:flex;gap:7px;flex-wrap:wrap}
.rpill{background:rgba(255,255,255,.85);border:1.5px solid rgba(42,26,14,.1);border-radius:13px;padding:7px 13px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.rpill-v{font-family:'Zen Dots',monospace;font-size:18px;color:var(--ink)}
.rpill-l{font-size:9px;color:rgba(42,26,14,.4);margin-top:2px}
.upg-wallet{font-size:13px;font-weight:700;color:rgba(42,26,14,.4);margin-top:auto}
.upg-wallet strong{font-family:'Zen Dots',monospace;font-size:19px;color:var(--gold2)}
.btn-next{width:100%;padding:14px;background:linear-gradient(145deg,var(--teal),var(--teal2));border:none;border-radius:16px;font-family:'Zen Dots',monospace;font-size:17px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(42,144,120,.5),0 7px 18px rgba(42,188,170,.25);transition:transform .12s,box-shadow .12s}
.btn-next:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(42,144,120,.5)}
.upg-right{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:5px}
.upg-right::-webkit-scrollbar{display:none}
.upg-sec{font-family:'Zen Dots',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(42,26,14,.28);margin:5px 0 3px}
.upg-card{background:#fff;border:2px solid rgba(42,26,14,.07);border-radius:15px;padding:10px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s,transform .12s;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.upg-card:hover{background:#fffaf4}
.upg-card:active{transform:scale(.97)}
.upg-card.off{opacity:.4;cursor:default}
.upg-card.broke{opacity:.5;cursor:default}
.u-ico{font-size:26px;flex-shrink:0}
.u-info{flex:1}
.u-name{font-size:13px;font-weight:900;color:var(--ink)}
.u-sub{font-size:10px;color:rgba(42,26,14,.38);margin-top:2px}
.u-dots{display:flex;gap:3px;margin-top:4px}
.udot{width:9px;height:9px;border-radius:50%;background:rgba(42,26,14,.1)}
.udot.on{background:var(--teal)}
.u-cost-btn{background:linear-gradient(145deg,#fffad0,#fde68a);border:2px solid rgba(248,200,50,.5);border-radius:11px;padding:5px 10px;box-shadow:0 3px 0 rgba(200,144,16,.28);cursor:pointer;text-align:center;flex-shrink:0;transition:transform .12s,box-shadow .12s}
.u-cost-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(200,144,16,.28)}
.u-cost-v{font-family:'Zen Dots',monospace;font-size:14px;color:var(--gold2)}
.u-cost-l{font-size:8px;color:rgba(200,144,16,.6)}
.u-max{font-size:10px;font-weight:800;color:rgba(42,26,14,.22);padding:5px 8px;flex-shrink:0}

/* ═══════════════════════════════════
   TUTORIAL
═══════════════════════════════════ */
.tut-overlay{position:fixed;inset:0;z-index:999;pointer-events:none}

</style>

/* ═══════════════════════════ STATE ═══════════════════════════ */

const $=id=>document.getElementById(id);

/* ═══════════════════════════ MAP ═══════════════════════════ */
function renderMap(){
  $('map-coins').textContent=S.coins;
  const pp=$('map-petals');pp.innerHTML='';
  for(let i=0;i<14;i++){
    const el=document.createElement('div');el.className='petal';el.textContent='🌸';
    el.style.cssText=`left:${Math.random()*100}%;top:${-5+Math.random()*15}%;animation-duration:${5+Math.random()*9}s;animation-delay:-${Math.random()*12}s;font-size:${9+Math.random()*9}px`;
    pp.appendChild(el);
  }
  const deco=$('map-deco');deco.innerHTML='';
  [['🌊',3,42],['🐠',13,36],['⛩️',30,44],['🌳',50,40],['🎋',65,38],['🗼',82,48]].forEach(([e,l,fs])=>{
    const d=document.createElement('div');d.className='deco-i';
    d.textContent=e;d.style.cssText=`left:${l}%;font-size:${fs}px`;
    deco.appendChild(d);
  });
  const path=$('levels-path');path.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    if(i>0){const ln=document.createElement('div');ln.className='lv-line';path.appendChild(ln);}
    const stars=S.stars[lv.id]||0,unlocked=lv.id<=nextUnlocked(),isCur=lv.id===nextUnlocked();
    const wrap=document.createElement('div');wrap.className='lv-wrap';
    const node=document.createElement('div');
    node.className='lv-node '+(stars>0?'done':isCur?'next':'locked');
    let sh='';for(let s=1;s<=3;s++)sh+=`<span>${s<=stars?'⭐':'☆'}</span>`;
    node.innerHTML=stars>0||isCur?`<div class="lv-num">${lv.id}</div><div class="lv-stars">${sh}</div>`:'<span style="font-size:24px">🔒</span>';
    if(unlocked)node.onclick=()=>startLevel(lv.id);
    const shadow=document.createElement('div');shadow.className='lv-shadow';
    wrap.appendChild(node);wrap.appendChild(shadow);path.appendChild(wrap);
  });
}
const nextUnlocked=()=>{for(const l of LEVELS)if(!(S.stars[l.id]>0))return l.id;return LEVELS[LEVELS.length-1].id};

/* ═══════════════════════════ START LEVEL ═══════════════════════════ */
function startLevel(id){
  const cfg=LEVELS.find(l=>l.id===id);if(!cfg)return;
  G={cfg,running:false,ended:false,timeLeft:cfg.time,coins:0,ordersOk:0,ordersFailed:0,
     storage:{},orders:[],oid:0,sources:{},kitchens:{},
     mopers:[{id:0,busy:false,tl:0,x:0},{id:1,busy:false,tl:0,x:0}],
     selOrder:null,tick:null};
  cfg.sources.forEach(k=>G.sources[k]={cd:0,maxCd:sCd(k)});
  cfg.kitchens.forEach(k=>G.kitchens[k]={running:false,tl:0,total:kTm(k)});
  buildWorld();show('screen-game');
  setTimeout(()=>{spawnOrder();spawnOrder();if(id===1)runTutorial(()=>beginGame());else beginGame();},350);
}

/* ── SOURCE OBJECTS (piers, fields, aqua, garden) ── */
function buildSourceObjects(container,cfg,W,H,roadH,dirtH,grassH,waterH){
  const sources=cfg.sources;
  // Layout: fisher on pier (water), aqua on water-right, rice field center-grass, garden on hill-right
  const layouts={
    fisher:{x:0.18,zone:'water',side:'left'},
    aqua:  {x:0.42,zone:'water',side:'left'},
    rice:  {x:0.52,zone:'grass',side:'center'},
    garden:{x:0.72,zone:'hill', side:'right'},
  };

  sources.forEach(k=>{
    const lo=layouts[k]||{x:0.5,zone:'grass'};
    const s=SOURCES[k];
    const cx=Math.round(lo.x*W);

    if(k==='fisher') buildPier(container,k,cx,W,H,roadH,dirtH,grassH,waterH);
    else if(k==='aqua') buildAquarium(container,k,cx,W,H,roadH,dirtH,grassH,waterH);
    else if(k==='rice') buildRiceField(container,k,cx,W,H,roadH,dirtH,grassH);
    else if(k==='garden') buildGarden(container,k,cx,W,H,roadH,dirtH,grassH);
  });
}

/* ═══════════════════════════ GAME LOOP ═══════════════════════════ */
const TICK=200;
function beginGame(){G.running=true;G.tick=setInterval(gameTick,TICK)}

function gameTick(){
  if(!G.running)return;
  G.timeLeft-=TICK/1000;
  if(G.timeLeft<=0){G.timeLeft=0;endGame();return;}
  refreshTimer();

  // Sources
  G.cfg.sources.forEach(k=>{
    const s=G.sources[k];
    if(s.cd>0){
      s.cd=Math.max(0,s.cd-TICK);
      const pct=100-(s.cd/s.maxCd*100);
      const bar=$('pbf-'+k);if(bar)bar.style.width=pct+'%';
      const rg=$('src-ready-'+k);if(rg)rg.style.display=s.cd===0?'block':'none';
      const src=$('src-'+k);if(src){src.style.opacity=s.cd>0?'0.7':'1';}
    }
  });

  // Kitchens
  G.cfg.kitchens.forEach(k=>{
    const kit=G.kitchens[k];
    if(kit.running){
      kit.tl-=TICK;
      const pct=((kit.total-kit.tl)/kit.total)*100;
      [$('bpf-'+k),$('kpf-'+k)].forEach(b=>{if(b)b.style.width=Math.min(100,pct)+'%'});
      if(kit.tl<=0){
        kit.running=false;
        [$('bpf-'+k),$('kpf-'+k)].forEach(b=>{if(b)b.style.width='0%'});
        $('bldw-'+k)?.classList.remove('bld-working');
        $('kc-'+k)?.classList.remove('working');
        addStorage(KITCHENS[k].out);
        fxEl($('bld-'+k),KITCHENS[k].out+' готово!','#2abcaa');
        refreshSteps();
      }
    }
  });

  // Mopers
  const W=window.innerWidth;
  G.mopers.forEach(m=>{
    if(m.busy&&m.tl>0){
      m.tl-=TICK;m.x=Math.min(W+100,m.x+6);
      const el=$('mp-'+m.id);if(el)el.style.left=m.x+'px';
      if(m.tl<=0){
        m.busy=false;
        const sx=[Math.round(W*0.28),Math.round(W*0.55)];m.x=sx[m.id];
        if(el){el.style.left=m.x+'px';el.classList.remove('moped-glow');el.classList.remove('moving');}
        const mb=$('mpb-'+m.id);if(mb)mb.textContent='Готов ✓';
      }
    }
  });

  // Orders timer
  let rerender=false;
  G.orders.forEach(o=>{
    if(!o.active)return;
    o.tl-=TICK/1000;
    if(o.tl<=0){o.active=false;G.ordersFailed++;rerender=true;refreshStars();setTimeout(()=>{if(G.running)spawnOrder();},2500);}
    else{const f=$('otf-'+o.id);if(f){const p=(o.tl/o.maxTl)*100;f.style.width=p+'%';f.classList.toggle('low',p<25);}}
  });
  if(rerender)renderOrders();
  if(G.orders.filter(o=>o.active).length<G.cfg.maxOrders&&Math.random()<0.006)spawnOrder();
  checkAllDeliv();
}

/* ═══════════════════════════ INTERACTIONS ═══════════════════════════ */
function tapSource(k){
  if(!G.running)return;
  const s=G.sources[k];if(s.cd>0)return;
  if(stUsed()>=stMax()){fxXY(window.innerWidth*.5,60,'🧊 Холодильник полон!','#e8403a');return;}
  addStorage(SOURCES[k].out);
  s.cd=sCd(k);s.maxCd=s.cd;
  const rg=$('src-ready-'+k);if(rg)rg.style.display='none';
  const src=$('src-'+k);if(src)src.style.opacity='0.7';
  spawnParticles($('src-'+k),SOURCES[k].out);
  fxEl($('src-'+k),SOURCES[k].out+' +1','#2abcaa');
  refreshSteps();
}

function tapKitchen(k){
  if(!G.running)return;
  const kit=G.kitchens[k];if(kit.running)return;
  const need1=KITCHENS[k].in,need2=KITCHENS[k].in2;
  if(!(G.storage[need1]>0)){fxXY(window.innerWidth*.72,120,'Нужно '+need1,'#e8403a');return;}
  if(!(G.storage[need2]>0)){fxXY(window.innerWidth*.72,120,'Нужно '+need2,'#e8403a');return;}
  removeStorage(need1,1);removeStorage(need2,1);
  kit.running=true;kit.tl=kTm(k);kit.total=kit.tl;
  $('bldw-'+k)?.classList.add('bld-working');
  $('kc-'+k)?.classList.add('working');
  refreshSteps();
}

function tapMoper(id){
  if(!G.running)return;
  const moper=G.mopers[id];if(moper.busy)return;
  if(!G.selOrder){fxXY(window.innerWidth*.5,100,'👆 Выбери заказ!','#f8c832');return;}
  const order=G.orders.find(o=>o.id===G.selOrder&&o.active);
  if(!order){G.selOrder=null;renderOrders();return;}
  if(!order.deliverable){fxXY(window.innerWidth*.5,100,'❌ Не хватает!','#e8403a');return;}
  const need={};order.items.forEach(i=>need[i]=(need[i]||0)+1);
  Object.entries(need).forEach(([i,q])=>removeStorage(i,q));
  order.active=false;G.ordersOk++;G.coins+=order.reward;G.selOrder=null;
  refreshCoins();refreshStars();renderOrders();
  moper.busy=true;moper.tl=mTm();
  const el=$('mp-'+id);
  el?.classList.remove('moped-glow');el?.classList.add('moving');
  const mb=$('mpb-'+id);if(mb)mb.textContent='🏍️ Едет!';
  fxXY(window.innerWidth*.5,72,'+'+order.reward+'🪙','#f8c832');
  fxXY(window.innerWidth*.5,100,'✅ Доставлено!','#2abcaa');
  setTimeout(()=>{if(G.running)spawnOrder();},2200);
  refreshSteps();
}

function selectOrder(id){
  G.selOrder=G.selOrder===id?null:id;renderOrders();
  if(G.selOrder){
    const rm=G.mopers.find(m=>!m.busy);
    if(rm){const el=$('mp-'+rm.id);el?.classList.add('moped-glow');setTimeout(()=>el?.classList.remove('moped-glow'),2500);}
  }
  refreshSteps();
}

/* ═══════════════════════════ STORAGE ═══════════════════════════ */
function addStorage(item){G.storage[item]=(G.storage[item]||0)+1;renderFridge();checkAllDeliv();}
function removeStorage(item,qty){G.storage[item]=(G.storage[item]||0)-qty;if(G.storage[item]<=0)delete G.storage[item];renderFridge();checkAllDeliv();}
function renderFridge(){
  const max=stMax(),used=stUsed();
  const cnt=$('fridge-count');if(cnt)cnt.textContent=`(${used}/${max})`;
  const items=$('fridge-items');
  if(items){
    const entries=Object.entries(G.storage).filter(([,v])=>v>0);
    items.innerHTML=entries.length
      ?entries.map(([e,q])=>`<div class="fridge-chip">${e}<span>×${q}</span></div>`).join('')
      :'<div class="fridge-empty">Пусто</div>';
  }
}

/* ═══════════════════════════ ORDERS ═══════════════════════════ */
function spawnOrder(){
  if(G.orders.filter(o=>o.active).length>=G.cfg.maxOrders)return;
  const pi=Math.min(G.cfg.id-1,ORDER_POOLS.length-1);
  const prod=new Set([...G.cfg.sources.map(k=>SOURCES[k].out),...G.cfg.kitchens.map(k=>KITCHENS[k].out)]);
  const valid=ORDER_POOLS[pi].filter(t=>t.i.every(x=>prod.has(x)));
  if(!valid.length)return;
  const tmpl=valid[Math.floor(Math.random()*valid.length)];
  const dur=28+tmpl.i.length*10;
  G.orders.push({id:++G.oid,items:[...tmpl.i],reward:tmpl.r,tl:dur,maxTl:dur,active:true,deliverable:false});
  renderOrders();
}

function renderOrders(){
  const list=$('orders-list');list.innerHTML='';
  const active=G.orders.filter(o=>o.active);
  if(!active.length){list.innerHTML='<div style="color:rgba(42,26,14,.2);font-size:10px;font-weight:800;text-align:center;padding:12px">Ожидаем...</div>';return;}
  active.forEach(o=>{
    checkDeliv(o);
    const isSel=G.selOrder===o.id;
    const html=o.items.map(item=>`<span class="oi ${(G.storage[item]||0)>0?'':'dim'}">${item}</span>`).join('');
    const card=document.createElement('div');
    card.className='order-card'+(isSel?' sel':'')+(o.deliverable&&!isSel?' ready':'');
    card.id='oc-'+o.id;card.onclick=()=>selectOrder(o.id);
    card.innerHTML=`<div class="oi-row">${html}</div><div class="o-reward">🪙${o.reward}</div><div class="o-tbar"><div class="o-tfill" id="otf-${o.id}" style="width:${o.tl/o.maxTl*100}%"></div></div>`;
    list.appendChild(card);
  });
  for(let i=active.length;i<G.cfg.maxOrders;i++)list.innerHTML+='<div class="o-ph">🍱</div>';
}

function checkDeliv(o){
  const need={};o.items.forEach(i=>need[i]=(need[i]||0)+1);
  o.deliverable=Object.entries(need).every(([i,q])=>(G.storage[i]||0)>=q);
}
function checkAllDeliv(){
  G.orders.forEach(o=>{if(o.active)checkDeliv(o);});
  G.orders.filter(o=>o.active).forEach(o=>{
    const c=$('oc-'+o.id);if(!c)return;
    c.classList.toggle('ready',o.deliverable&&G.selOrder!==o.id);
    c.classList.toggle('sel',G.selOrder===o.id);
    c.querySelectorAll('.oi').forEach((el,i)=>el.classList.toggle('dim',(G.storage[o.items[i]]||0)===0));
  });
  refreshSteps();
}

/* ═══════════════════════════ DISPLAY ═══════════════════════════ */
function refreshTimer(){
  const el=$('tb-timer');
  const m=Math.floor(G.timeLeft/60),s=Math.floor(G.timeLeft%60);
  el.textContent=m+':'+String(s).padStart(2,'0');
  el.classList.toggle('red',G.timeLeft<30);
}
function refreshCoins(){$('tb-coins').textContent=G.coins;}
function refreshStars(){
  const n=calcStars();
  document.querySelectorAll('#tb-stars .tb-star').forEach((el,i)=>{
    el.textContent=i<n?'⭐':'☆';
    el.classList.toggle('on',i<n);
  });
}
function calcStars(){const g=G.cfg.goals;return G.coins>=g[2]?3:G.coins>=g[1]?2:G.coins>=g[0]?1:0;}
function refreshSteps(){
  if(!G)return;
  [0,1,2,3].forEach(i=>{const el=$('sp'+i);if(el)el.className='step-pill';});
  const hasRes=Object.values(G.storage||{}).some(v=>v>0);
  const canKit=G.cfg.kitchens.some(k=>{const kit=KITCHENS[k];return(G.storage[kit.in]||0)>0&&(G.storage[kit.in2]||0)>0&&!G.kitchens[k].running;});
  const kitRun=Object.values(G.kitchens||{}).some(k=>k.running);
  const hasReady=G.orders.some(o=>o.active&&o.deliverable);
  const hasSel=!!G.selOrder;
  const set=(i,cls)=>{const el=$('sp'+i);if(el)el.className='step-pill '+cls;};
  if(!hasRes&&!kitRun)set(0,'active');
  else if(canKit){set(0,'done');set(1,'active');}
  else if(hasReady&&!hasSel){set(0,'done');set(1,'done');set(2,'active');}
  else if(hasSel){set(0,'done');set(1,'done');set(2,'done');set(3,'active');}
  else if(hasRes||kitRun)set(0,'done');
}

/* ═══════════════════════════ FX ═══════════════════════════ */
function fxEl(el,t,c){if(!el)return;const r=el.getBoundingClientRect();fxXY(r.left+r.width/2,r.top,t,c);}
function fxXY(x,y,t,c){
  const el=document.createElement('div');el.className='fx';
  el.style.cssText=`left:${x-40}px;top:${y-8}px;color:${c}`;
  el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
}
function spawnParticles(el){
  if(!el)return;
  const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const colors=['#2abcaa','#f8c832','#f4846a','#6cc83a','#e8403a'];
  for(let i=0;i<8;i++){
    const p=document.createElement('div');p.className='particle';
    const ang=Math.random()*360,dist=40+Math.random()*50;
    const dx=Math.cos(ang*Math.PI/180)*dist,dy=Math.sin(ang*Math.PI/180)*dist;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:7px;height:7px;background:${colors[i%colors.length]};--fly:translate(${dx}px,${dy}px);animation-delay:${i*.035}s`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),900);
  }
}

/* ═══════════════════════════ END ═══════════════════════════ */
function endGame(){
  if(G.ended)return;G.ended=true;G.running=false;clearInterval(G.tick);
  const stars=calcStars();
  S.stars[G.cfg.id]=Math.max(S.stars[G.cfg.id]||0,stars);
  S.coins+=G.coins;
  setTimeout(()=>showResult(stars),600);
}
function goMap(){if(G){G.running=false;clearInterval(G.tick);}show('screen-map');renderMap();}

/* ═══════════════════════════ RESULT ═══════════════════════════ */
function showResult(stars){
  $('upg-hl').textContent=stars===0?'😔 Ещё раз!':stars===1?'👍 Пройден!':stars===2?'🎉 Отлично!':'🏆 Мастер суши!';
  document.querySelectorAll('#upg-stars .s-big').forEach((el,i)=>setTimeout(()=>{el.textContent=i<stars?'⭐':'☆';if(i<stars)el.classList.add('on');},i*280));
  $('res-pills').innerHTML=`
    <div class="rpill"><div class="rpill-v">🪙${G.coins}</div><div class="rpill-l">Монет</div></div>
    <div class="rpill"><div class="rpill-v">📦${G.ordersOk}</div><div class="rpill-l">Доставлено</div></div>
    <div class="rpill"><div class="rpill-v">❌${G.ordersFailed}</div><div class="rpill-l">Просрочено</div></div>`;
  $('upg-wallet').textContent=S.coins;
  buildUpgList();
  const btn=$('btn-next');
  if(stars===0){btn.textContent='🔄 Ещё раз';btn.onclick=()=>startLevel(G.cfg.id);}
  else{const nid=G.cfg.id+1,has=LEVELS.find(l=>l.id===nid);btn.textContent=has?'Следующий →':'🗺 На карту';btn.onclick=()=>{show('screen-map');renderMap();};}
  show('screen-upgrade');
}

function buildUpgList(){
  const list=$('upg-list');list.innerHTML='';
  list.innerHTML+='<div class="upg-sec">🎣 Источники</div>';
  UPG.forEach((item,idx)=>{
    const lv=S.upg[item.k]||1,maxed=lv>=item.m,cost=UCOSTS[lv],afford=S.coins>=cost;
    const dots=Array.from({length:item.m},(_,i)=>`<div class="udot ${i<lv?'on':''}"></div>`).join('');
    const card=document.createElement('div');
    card.className='upg-card'+(maxed?' off':'')+((!afford&&!maxed)?' broke':'');
    card.innerHTML=`<div class="u-ico">${item.e}</div><div class="u-info"><div class="u-name">${item.n}</div><div class="u-sub">${item.d} · Lv${lv}${maxed?'':' → '+(lv+1)}</div><div class="u-dots">${dots}</div></div>${maxed?`<div class="u-max">МАКС ✓</div>`:`<div class="u-cost-btn" style="opacity:${afford?1:.4}"><div class="u-cost-v">🪙${cost}</div><div class="u-cost-l">Купить</div></div>`}`;
    if(!maxed&&afford){card.onclick=()=>{S.upg[item.k]++;S.coins-=cost;$('upg-wallet').textContent=S.coins;$('map-coins').textContent=S.coins;buildUpgList();fxXY(window.innerWidth*.72,185,'⬆️ '+item.n+' Lv'+(lv+1),'#2abcaa');};}
    list.appendChild(card);
    if(item.k==='garden')list.innerHTML+='<div class="upg-sec" style="margin-top:5px">👨‍🍳 Кухня и доставка</div>';
  });
}

/* ═══════════════════════════ TUTORIAL ═══════════════════════════ */
const TUT=[
  {t:'src-fisher',title:'🎣 Тапни рыбака!',text:'Рыбак на пирсе ловит рыбу. Тапни его когда светится — получишь 🐟 для кухни!',pos:'right'},
  {t:'fridge-card',title:'🧊 Холодильник',text:'Все ингредиенты хранятся здесь. Следи — не переполни склад!',pos:'left'},
  {t:'kc-sushi',title:'🍣 Готовь суши!',text:'Тапни суши-стол — нужны рыба + рис. Повар в окне всё приготовит!',pos:'left'},
  {t:'orders-list',title:'📋 Выбери заказ!',text:'Тапни карточку заказа. Когда всё есть — зелёная рамка!',pos:'right'},
  {t:'mp-0',title:'🛵 Доставляй!',text:'Выбери заказ потом тапни мопед — курьер помчится к клиенту!',pos:'top'},
];
let tutI=0,tutOv=null;
function runTutorial(done){tutI=0;showTutStep(done);}
function showTutStep(done){
  if(tutOv){tutOv.remove();tutOv=null;}
  if(tutI>=TUT.length){done();return;}
  const step=TUT[tutI];
  const ov=document.createElement('div');ov.className='tut-overlay';tutOv=ov;
  const bg=document.createElement('div');bg.className='tut-bg';ov.appendChild(bg);
  const target=$(step.t);
  let tx=window.innerWidth/2-114,ty=window.innerHeight/2-100;
  if(target){
    const r=target.getBoundingClientRect();
    const hl=document.createElement('div');hl.className='tut-hl';
    hl.style.cssText=`top:${r.top-5}px;left:${r.left-5}px;width:${r.width+10}px;height:${r.height+10}px`;
    ov.appendChild(hl);
    if(step.pos==='right'){tx=r.right+12;ty=r.top+r.height/2-80;}
    else if(step.pos==='left'){tx=r.left-244;ty=r.top+r.height/2-80;}
    else if(step.pos==='top'){tx=r.left+r.width/2-114;ty=r.top-196;}
    tx=Math.max(8,Math.min(window.innerWidth-244,tx));
    ty=Math.max(8,Math.min(window.innerHeight-210,ty));
  }
  const bubble=document.createElement('div');bubble.className='tut-bubble';
  const arr=step.pos==='top'?'👇':step.pos==='right'?'👈':'👉';
  bubble.innerHTML=`<span class="tut-arrow">${arr}</span><div class="tut-title">${step.title}</div><div class="tut-text">${step.text}</div><button class="tut-ok">${tutI<TUT.length-1?'Понял! →':'Поехали! 🍣'}</button>`;
  bubble.style.cssText=`left:${tx}px;top:${ty}px`;
  bubble.querySelector('.tut-ok').onclick=()=>{tutI++;showTutStep(done);};
  ov.appendChild(bubble);document.body.appendChild(ov);
}

/* ═══════════════════════════ INIT ═══════════════════════════ */
renderMap();show('screen-map');
</script>
