<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🍣 Sushi Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ══ RESET & BASE ══ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
  width:100%;height:100%;overflow:hidden;touch-action:manipulation;
  background:#5ab8e8; /* sky color — never shows black */
  font-family:'M PLUS Rounded 1c',sans-serif;
}

/* ══ CSS VARS ══ */
:root{
  --red:#e8403a;--red2:#b82020;
  --teal:#2abcaa;--teal2:#1a8c7a;
  --gold:#f8c832;--gold2:#c89010;
  --ink:#2a1a0e;
  --glass:rgba(255,252,245,.88);
}

/* ══ SCREENS ══ */
.screen{position:fixed;inset:0;overflow:hidden}
.screen.hidden{display:none}

/* ══════════════════════════════════════
   MAP SCREEN
══════════════════════════════════════ */
#screen-map{
  background:linear-gradient(170deg,#a8dcff 0%,#c8f0e0 40%,#b8e870 75%,#78c828 100%);
  display:flex;flex-direction:column;
}
.map-header{
  padding:12px 18px 8px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:2;
}
.map-logo{font-family:'Zen Dots',monospace;font-size:22px;color:var(--red);text-shadow:0 2px 0 rgba(184,32,32,.2)}
.map-logo-sub{font-size:9px;color:rgba(42,26,14,.4);font-weight:800;letter-spacing:2px}
.map-coins-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,252,245,.9);border:2px solid rgba(248,200,50,.5);
  border-radius:24px;padding:5px 14px;font-family:'Zen Dots',monospace;
  font-size:17px;color:var(--gold2);box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.map-banner{
  margin:0 14px 10px;
  background:rgba(255,252,245,.82);border:2px solid rgba(42,188,170,.3);
  border-radius:12px;padding:7px 14px;display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(8px);
}
.map-banner-t{font-family:'Zen Dots',monospace;font-size:11px;color:var(--teal2)}
.map-banner-s{font-size:8px;color:rgba(42,26,14,.35);font-weight:800;margin-top:1px}
.map-scroll-area{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;padding:10px 24px 14px}
.map-scroll-area::-webkit-scrollbar{display:none}
.levels-row{display:flex;align-items:center;gap:0;min-width:max-content}
.lv-connector{width:40px;height:3px;background:repeating-linear-gradient(90deg,rgba(42,26,14,.2) 0,rgba(42,26,14,.2) 4px,transparent 4px,transparent 8px)}
.lv-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.lv-node{
  width:78px;height:78px;border-radius:50%;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;transition:transform .14s;
  border:4px solid #fff;
}
.lv-node:active{transform:scale(.86) translateY(3px)}
.lv-node.done{
  background:radial-gradient(circle at 38% 30%,#e0fff8,var(--teal),var(--teal2));
  box-shadow:0 7px 0 var(--teal2),0 10px 22px rgba(42,188,170,.35),inset 0 2px 0 rgba(255,255,255,.5);
}
.lv-node.next{
  background:radial-gradient(circle at 38% 30%,#fffce0,var(--gold),var(--gold2));
  box-shadow:0 7px 0 var(--gold2),0 10px 22px rgba(248,200,50,.4),inset 0 2px 0 rgba(255,255,255,.5);
  animation:nxt-pulse 2s ease-in-out infinite;
}
@keyframes nxt-pulse{0%,100%{box-shadow:0 7px 0 var(--gold2),0 0 0 0 rgba(248,200,50,.6)}50%{box-shadow:0 7px 0 var(--gold2),0 0 0 14px rgba(248,200,50,0)}}
.lv-node.locked{background:radial-gradient(circle at 38% 30%,#ddd,#aaa,#777);box-shadow:0 6px 0 #555,inset 0 2px 0 rgba(255,255,255,.25);opacity:.55;cursor:default}
.lv-num{font-family:'Zen Dots',monospace;font-size:24px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.lv-stars-row{display:flex;gap:1px;font-size:11px}
.lv-shadow{width:58px;height:8px;background:radial-gradient(ellipse,rgba(0,0,0,.14),transparent);border-radius:50%}
.map-deco-strip{position:absolute;bottom:0;left:0;right:0;height:28%;pointer-events:none;display:flex;align-items:flex-end;padding:0 6% 0;justify-content:space-between}
.deco-item{font-size:38px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.petal{position:absolute;animation:pfall linear infinite;pointer-events:none;font-size:12px}
@keyframes pfall{from{transform:translateY(-20px) rotate(0) translateX(0)}to{transform:translateY(110vh) rotate(540deg) translateX(60px);opacity:0}}

/* ══════════════════════════════════════
   GAME SCREEN — 3D ISOMETRIC WORLD
══════════════════════════════════════ */
#screen-game{display:flex;flex-direction:column;background:#5ab8e8}

/* ── WORLD CANVAS ── */
#world{
  flex:1;position:relative;overflow:hidden;
  /* perspective for 3D */
  perspective:900px;
  background:linear-gradient(180deg,
    #4ab0f0 0%,
    #7dcef8 28%,
    #a8e0f8 42%
  );
}

/* ── SKY LAYER ── */
.sky-sun{
  position:absolute;top:6%;right:12%;
  width:56px;height:56px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 42%36%,#fffce0,#ffe060,#ffaa00);
  box-shadow:0 0 0 10px rgba(255,220,50,.12),0 0 0 22px rgba(255,200,40,.07),0 0 50px rgba(255,180,0,.4);
  animation:sun-pulse 5s ease-in-out infinite;
}
@keyframes sun-pulse{0%,100%{box-shadow:0 0 0 10px rgba(255,220,50,.12),0 0 50px rgba(255,180,0,.35)}50%{box-shadow:0 0 0 18px rgba(255,220,50,.18),0 0 70px rgba(255,180,0,.55)}}
.sky-cloud{position:absolute;font-size:36px;animation:cloud-drift linear infinite;filter:drop-shadow(0 3px 6px rgba(0,0,50,.06));z-index:2;opacity:.88}
@keyframes cloud-drift{from{transform:translateX(-150px)}to{transform:translateX(115vw)}}

/* ── GROUND PLANE — CSS 3D PERSPECTIVE TRICK ── */
/* Использует transform на слоях чтобы дать ощущение глубины */
.ground-wrap{
  position:absolute;left:0;right:0;bottom:0;
  height:68%;
  transform-origin:bottom center;
  transform:perspective(700px) rotateX(8deg);
  transform-style:preserve-3d;
}

/* Terrain bands — from front to back */
.band{position:absolute;left:0;right:0}
.band-road{
  bottom:0;height:18%;
  background:linear-gradient(180deg,#454558 0%,#2a2a38 55%,#1a1a26 100%);
  border-top:2px solid rgba(255,255,255,.07);
}
.band-road::after{/* dashes */
  content:'';position:absolute;top:44%;left:0;right:0;height:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0,rgba(255,255,255,.5) 24px,transparent 24px,transparent 52px);
  border-radius:3px;
}
.band-dirt{
  bottom:18%;height:10%;
  background:linear-gradient(180deg,#d89040 0%,#a86820 55%,#885010 100%);
}
.band-grass{
  bottom:28%;height:24%;
  background:linear-gradient(180deg,#78d840 0%,#52a818 45%,#357808 100%);
}
.band-water{
  bottom:52%;height:20%;
  background:linear-gradient(180deg,#48b8e8 0%,#2888c0 55%,#1060a0 100%);
  overflow:hidden;
}
.band-water::before{/* wave shimmer */
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0,rgba(255,255,255,.1) 38px,transparent 38px,transparent 80px);
  animation:wsh 3s linear infinite;
}
@keyframes wsh{from{background-position:0}to{background-position:80px}}
.band-water::after{/* wave lines */
  content:'';position:absolute;top:18%;left:0;right:0;height:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0,rgba(255,255,255,.22) 48px,transparent 48px,transparent 96px);
  animation:wsh 2.5s linear infinite reverse;border-radius:3px;
}
.band-hillbg{
  bottom:72%;height:18%;
  background:linear-gradient(180deg,#88c840 0%,#60a010 60%,#3a7808 100%);
  clip-path:ellipse(60% 100% at 50% 100%);
}

/* Side hills for depth */
.hill-left,.hill-right{
  position:absolute;bottom:52%;z-index:3;
  width:22%;height:60px;border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,#6cc830,#3a8800);
}
.hill-left{left:-3%;box-shadow:inset -4px 0 12px rgba(0,0,0,.1)}
.hill-right{right:-3%;box-shadow:inset 4px 0 12px rgba(0,0,0,.1)}

/* Fence along water/grass border */
.fence-bar{
  position:absolute;bottom:52%;left:0;right:0;z-index:5;height:14px;
  background:repeating-linear-gradient(90deg,
    #d4a040 0,#d4a040 10px,
    #b07818 10px,#b07818 12px,
    transparent 12px,transparent 50px
  );
}

/* ── SCENE OBJECTS (CSS positioned %) ── */
.scene-obj{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;z-index:10;
  /* drop shadow for 3D feel */
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.22));
  transition:transform .12s,filter .12s;
}
.scene-obj:active{transform:scale(.88) translateY(4px)!important;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.scene-obj.dim{filter:drop-shadow(0 6px 10px rgba(0,0,0,.15)) brightness(.82) saturate(.6)}

/* Object shadow on ground */
.obj-shadow{
  width:70%;height:8px;
  background:radial-gradient(ellipse,rgba(0,0,0,.22),transparent);
  border-radius:50%;margin-top:2px;flex-shrink:0;
}

/* Ready glow ring */
.ready-ring{
  position:absolute;inset:-8px;border-radius:14px;
  box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(248,200,50,.6);
  animation:ring-pulse .9s ease-in-out infinite;display:none;
}
.ready-ring.show{display:block}
@keyframes ring-pulse{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 10px rgba(248,200,50,.5)}50%{box-shadow:0 0 0 5px var(--gold),0 0 22px rgba(248,200,50,.8)}}

/* Progress arc under object */
.obj-pbar{width:64px;height:5px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden;margin-top:1px;border:1px solid rgba(255,255,255,.3)}
.obj-pfill{height:100%;background:linear-gradient(90deg,var(--teal),#a0f060);border-radius:3px;transition:width .25s linear}

/* Lv badge */
.lv-badge{
  position:absolute;top:-8px;right:-8px;
  background:linear-gradient(145deg,#fffce0,var(--gold));
  border:2px solid var(--gold2);border-radius:7px;
  padding:1px 5px;font-size:8px;font-weight:900;color:var(--gold2);
  box-shadow:0 2px 0 rgba(180,120,0,.4);z-index:2;
  white-space:nowrap;
}

/* ── PIER ── */
.pier-body{
  position:relative;width:90px;height:62px;
  background:linear-gradient(180deg,#c8a048,#a07826,#785808);
  border-radius:6px 6px 0 0;border:2.5px solid #503808;
  box-shadow:0 6px 0 #302000,0 8px 20px rgba(0,0,0,.3);
}
.pier-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 13px);border-radius:5px 5px 0 0}
.pier-body::after{content:'';position:absolute;top:0;left:0;right:0;height:35%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);border-radius:5px 5px 0 0}
.pier-posts{position:absolute;bottom:-22px;left:0;right:0;display:flex;justify-content:space-around}
.pier-post{width:9px;background:linear-gradient(180deg,#a07826,#503808);border-radius:0 0 3px 3px;border:1.5px solid #302000}

/* ── AQUARIUM ── */
.aqua-body{
  position:relative;width:76px;height:62px;border-radius:8px;
  background:linear-gradient(160deg,#50d8ff,#1898d8,#0868a8);
  border:3px solid #0848a0;
  box-shadow:0 6px 0 #042068,0 8px 20px rgba(8,80,168,.4);
  overflow:hidden;
}
.aqua-glass{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25) 0,rgba(255,255,255,.04) 55%)}
.aqua-water{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.06))}
.aqua-bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);animation:brise linear infinite}
@keyframes brise{from{transform:translateY(0);opacity:.55}to{transform:translateY(-70px);opacity:0}}
.aqua-fish{position:absolute;font-size:18px;animation:fswim linear infinite}
@keyframes fswim{0%{left:6px;transform:scaleX(1)}49%{left:calc(100% - 26px);transform:scaleX(1)}50%{left:calc(100% - 26px);transform:scaleX(-1)}100%{left:6px;transform:scaleX(-1)}}

/* ── RICE FIELD ── */
.field-body{
  position:relative;width:98px;height:66px;border-radius:8px;
  background:linear-gradient(180deg,#7cd040,#50a018,#307808);
  border:2.5px solid #204808;
  box-shadow:0 6px 0 #143208,0 8px 18px rgba(0,0,0,.22);
  overflow:hidden;
}
.field-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 14px)}
.field-top{position:absolute;top:0;left:0;right:0;height:35%;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent)}
.stalks{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:space-around;padding:0 4px}
.stalk{font-size:16px;animation:sway 2.2s ease-in-out infinite}
.stalk:nth-child(2){animation-delay:.25s}
.stalk:nth-child(3){animation-delay:.55s}
.stalk:nth-child(4){animation-delay:.85s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.field-farmer{position:absolute;bottom:4px;right:5px;font-size:20px;animation:fwork 2.5s ease-in-out infinite}
@keyframes fwork{0%,100%{transform:scaleX(1) rotate(-5deg)}50%{transform:scaleX(-1) rotate(5deg)}}

/* ── GARDEN ── */
.garden-body{
  position:relative;width:82px;height:56px;border-radius:8px;
  background:linear-gradient(180deg,#90c040,#60880a,#407008);
  border:2.5px solid #284008;
  box-shadow:0 5px 0 #182808,0 7px 16px rgba(0,0,0,.2);
  overflow:hidden;
}
.garden-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0,rgba(0,0,0,.04) 2px,transparent 2px,transparent 9px)}
.gplants{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:1px}
.gplant{font-size:15px;text-align:center;animation:pgrow 3.2s ease-in-out infinite}
.gplant:nth-child(2n){animation-delay:.6s}
@keyframes pgrow{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.1)}}

/* ── BUILDING ── */
.bld-wrap{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;z-index:11;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.28));
  transition:filter .2s;
}
.bld-wrap.working{filter:drop-shadow(0 10px 20px rgba(0,0,0,.28)) drop-shadow(0 0 12px rgba(42,188,170,.8))}
.bld-roof{
  width:0;height:0;
  /* triangle roof via borders */
}
.bld-roof-edge{height:12px;width:100%;border-radius:0 0 4px 4px;border:2px solid rgba(0,0,0,.25);border-top:none}
.bld-body{
  position:relative;width:100%;
  border:3px solid rgba(0,0,0,.22);border-top:none;border-radius:0 0 8px 8px;
  overflow:hidden;
}
.bld-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 9px)}
.bld-body::after{content:'';position:absolute;top:0;left:0;right:0;height:30%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent)}
.bld-sign{
  position:absolute;top:5px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.95);border:1.5px solid rgba(0,0,0,.1);
  border-radius:7px;padding:2px 6px;font-size:9px;font-weight:900;color:var(--ink);
  white-space:nowrap;z-index:3;box-shadow:0 2px 4px rgba(0,0,0,.1);
}
.bld-window{
  position:absolute;border:2px solid rgba(0,0,0,.25);border-radius:3px;
  background:linear-gradient(145deg,#c8e8f8,#88b8d8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);z-index:2;
}
.bld-window::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4) 0,transparent 55%);border-radius:2px}
.bld-door{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  border:2px solid rgba(0,0,0,.3);border-radius:3px 3px 0 0;z-index:2;
}
.bld-progress{position:absolute;bottom:0;left:0;right:0;height:7px;background:rgba(0,0,0,.2);z-index:4}
.bld-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),#80f060);transition:width .3s linear;width:0%}
.bld-cook{position:absolute;z-index:3;bottom:0;font-size:20px;animation:cook-bob 3s ease-in-out infinite}
@keyframes cook-bob{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-5px)}}
.chimney{position:absolute;top:-20px;width:13px;height:22px;background:linear-gradient(180deg,#777,#444);border:1.5px solid #222;border-radius:3px 3px 0 0}
.steam-puff{
  position:absolute;border-radius:50%;
  background:rgba(220,230,245,.6);
  animation:spuff 2.2s ease-out infinite;
}
@keyframes spuff{0%{transform:translateX(-50%) scale(.8);opacity:.6}100%{transform:translateX(-50%) scale(3);opacity:0;bottom:30px!important}}
.bld-lv{position:absolute;top:-8px;right:-8px;background:linear-gradient(145deg,#fffce0,var(--gold));border:2px solid var(--gold2);border-radius:7px;padding:1px 5px;font-size:8px;font-weight:900;color:var(--gold2);box-shadow:0 2px 0 rgba(180,120,0,.35);z-index:5}

/* ── MOPED ── */
.moped-wrap{
  position:absolute;bottom:3%;z-index:12;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;transition:left .15s linear;
}
.moped-bubble{
  background:#fff;border:2px solid var(--gold);border-radius:11px;
  padding:3px 9px;font-size:9px;font-weight:800;color:var(--gold2);
  box-shadow:0 3px 8px rgba(0,0,0,.1);white-space:nowrap;position:relative;
}
.moped-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}
.moped-icon{font-size:38px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.22));line-height:1}
.moped-wrap.moving .moped-icon{animation:mride .22s ease-in-out infinite}
@keyframes mride{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-5px)}}
.moped-wrap.glow .moped-icon{filter:drop-shadow(0 0 10px rgba(248,200,50,1)) drop-shadow(0 5px 10px rgba(0,0,0,.2));animation:mglow .7s ease-in-out infinite}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 5px 8px rgba(0,0,0,.2))}50%{filter:drop-shadow(0 0 18px var(--gold)) drop-shadow(0 5px 8px rgba(0,0,0,.2))}}

/* ── FLOATING UI ── */
#ui-layer{position:absolute;inset:0;pointer-events:none;z-index:30}

/* Top corners HUD */
.hud-tl{
  position:absolute;top:8px;left:8px;
  display:flex;flex-direction:column;gap:5px;
  pointer-events:all;
}
.hud-tr{
  position:absolute;top:8px;right:8px;
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  pointer-events:all;
}
.hud-chip{
  display:flex;align-items:center;gap:4px;
  background:rgba(255,252,245,.88);border:1.5px solid rgba(255,255,255,.6);
  border-radius:20px;padding:4px 10px;
  backdrop-filter:blur(10px);
  box-shadow:0 3px 12px rgba(0,0,0,.14);
}
.hud-lv{background:var(--red);border-radius:9px;padding:4px 11px;font-family:'Zen Dots',monospace;font-size:11px;color:#fff;box-shadow:0 3px 0 var(--red2)}
.hud-back{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,252,245,.88);border:2px solid rgba(184,32,32,.25);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--red);
  cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.14);backdrop-filter:blur(8px);
  transition:transform .12s;pointer-events:all;
}
.hud-back:active{transform:scale(.85)}
.hud-steps{display:flex;gap:3px}
.hstep{
  padding:3px 7px;border-radius:14px;font-size:9px;font-weight:800;
  background:rgba(255,255,255,.6);color:rgba(42,26,14,.28);

<script>
'use strict';

/* ══ DATA ══ */
const LEVELS=[

const SOURCES={

const KITCHENS={
  sushi:  {e:'🍣',n:'Суши-стол', color:'#c03030',roofC:'#8a1818',wallC:'#d84040',in:'🐟',in2:'🍚',out:'🍱',outN:'Суши',  baseTime:9000},
  tempura:{e:'🍤',n:'Темпура',   color:'#c86020',roofC:'#8a3808',wallC:'#e07030',in:'🦐',in2:'🍚',out:'🍤',outN:'Темпура',baseTime:11000},

const ORDER_POOLS=[
  [{i:['🐟'],r:70},{i:['🍚'],r:60},{i:['🐟','🍚'],r:140},{i:['🍱'],r:160}],
  [{i:['🐟'],r:70},{i:['🦐'],r:80},{i:['🍱'],r:160},{i:['🍤'],r:140},{i:['🐟','🦐'],r:180}],
  [{i:['🍱'],r:160},{i:['🍤'],r:140},{i:['🥑','🍚'],r:130},{i:['🍱','🍤'],r:280},{i:['🐟','🦐','🍚'],r:320}],
];
const UPG_DEFS=[
  {k:'fisher', e:'🎣',n:'Рыбак',       d:'Быстрее ловит рыбу',     m:5},
  {k:'rice',   e:'🌾',n:'Поле риса',   d:'Рис растёт быстрее',     m:5},
  {k:'aqua',   e:'🦐',n:'Аквариум',    d:'Быстрее даёт креветок',  m:5},
  {k:'garden', e:'🥑',n:'Огород',      d:'Авокадо растёт быстрее', m:5},
  {k:'sushi',  e:'🍣',n:'Суши-стол',   d:'Повар варит быстрее',    m:5},
  {k:'tempura',e:'🍤',n:'Темпура',     d:'Жарит быстрее',          m:5},
  {k:'moped',  e:'🛵',n:'Мопед',       d:'Быстрее доставляет',     m:5},

];
const UCOSTS=[0,150,280,450,650,900];

/* ══ STATE ══ */
const S={coins:0,stars:{},upg:{fisher:1,rice:1,aqua:1,garden:1,sushi:1,tempura:1,moped:1,fridge:1}};
let G=null;

const sCd  =k=>Math.max(1500,SOURCES[k].baseCd-(S.upg[k]-1)*1200);

const mTm  =()=>Math.max(1500,6000-(S.upg.moped-1)*1100);
const stMax=()=>6+(S.upg.fridge-1)*4;
const stUsed=()=>Object.values(G.storage).reduce((a,b)=>a+b,0);
const $=id=>document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    if(s.id===id){s.classList.remove('hidden');s.style.display='';}
    else{s.classList.add('hidden');}
  });
}

/* ══ MAP ══ */
function initMap(){
  $('map-coins').textContent=S.coins;
  // Petals
  const pl=$('petals-layer');pl.innerHTML='';
  for(let i=0;i<16;i++){
    const p=document.createElement('div');p.className='petal';p.textContent='🌸';
    p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*10-8}%;font-size:${9+Math.random()*9}px;animation-duration:${5+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;
    pl.appendChild(p);
  }
  // Deco
  const deco=$('map-deco');deco.innerHTML='';
  ['⛩️','🌊','🎋','🗼','🌸','🎏'].forEach((e,i)=>{
    const d=document.createElement('div');d.className='deco-item';d.textContent=e;deco.appendChild(d);
  });
  // Levels
  const row=$('levels-row');row.innerHTML='';
  const next=nextUnlocked();
  LEVELS.forEach((lv,i)=>{
    if(i>0){const ln=document.createElement('div');ln.className='lv-connector';row.appendChild(ln);}
    const stars=S.stars[lv.id]||0;
    const isNext=lv.id===next;
    const unlocked=lv.id<=next;
    const w=document.createElement('div');w.className='lv-wrap';
    const node=document.createElement('div');
    node.className='lv-node '+(stars>0?'done':isNext?'next':'locked');
    let sh='';for(let s=1;s<=3;s++)sh+=`<span>${s<=stars?'⭐':'☆'}</span>`;
    node.innerHTML=unlocked
      ?`<div class="lv-num">${lv.id}</div><div class="lv-stars-row">${sh}</div>`
      :`<span style="font-size:22px">🔒</span>`;
    if(unlocked)node.onclick=()=>startLevel(lv.id);
    w.appendChild(node);
    const sh2=document.createElement('div');sh2.className='lv-shadow';w.appendChild(sh2);
    row.appendChild(w);
  });
}
const nextUnlocked=()=>{for(const l of LEVELS)if(!(S.stars[l.id]>0))return l.id;return LEVELS[LEVELS.length-1].id};

/* ══ START LEVEL ══ */
function startLevel(id){
  const cfg=LEVELS.find(l=>l.id===id);if(!cfg)return;
  G={cfg,running:false,ended:false,timeLeft:cfg.time,coins:0,ordersOk:0,ordersFailed:0,
     storage:{},orders:[],oid:0,sources:{},kitchens:{},
     mopers:[{id:0,busy:false,tl:0},{id:1,busy:false,tl:0}],
     selOrder:null,tick:null};
  cfg.sources.forEach(k=>G.sources[k]={cd:0,maxCd:sCd(k)});
  cfg.kitchens.forEach(k=>G.kitchens[k]={running:false,tl:0,total:kTm(k)});

  // Show screen first, THEN build world after a frame
  showScreen('screen-game');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    buildScene(cfg);
    refreshHUD();
    spawnOrder();spawnOrder();
    if(id===1)runTutorial(()=>beginGame());else beginGame();
  }));
}

/* ══ BUILD SCENE ══ */
function buildScene(cfg){
  buildClouds();
  buildSources(cfg);
  buildBuildings(cfg);
  buildMopers();
  buildKitchenPanel(cfg);
}

function buildClouds(){
  const c=$('sky-clouds');c.innerHTML='';
  [{t:6,dur:26},{t:14,dur:40},{t:4,dur:34}].forEach((cl,i)=>{
    const el=document.createElement('div');el.className='sky-cloud';el.textContent='☁️';
    el.style.cssText=`top:${cl.t}px;font-size:${26+i*5}px;animation-duration:${cl.dur}s;animation-delay:-${i*12}s`;
    c.appendChild(el);
  });
}

/* ══ GAME LOOP ══ */
const TICK=200;
function beginGame(){G.running=true;G.tick=setInterval(gameTick,TICK)}

function gameTick(){
  if(!G.running)return;
  G.timeLeft-=TICK/1000;
  if(G.timeLeft<=0){G.timeLeft=0;endGame();return;}
  refreshTimer();

  // Sources cooldown
  G.cfg.sources.forEach(k=>{
    const s=G.sources[k];
    if(s.cd>0){
      s.cd=Math.max(0,s.cd-TICK);
      const pct=100-(s.cd/s.maxCd*100);
      const bar=$('pbf-'+k);if(bar)bar.style.width=pct+'%';
      const rr=$('rr-'+k);if(rr)rr.classList.toggle('show',s.cd===0);
      const srcEl=$('src-'+k);if(srcEl)srcEl.style.filter=s.cd>0?'drop-shadow(0 6px 10px rgba(0,0,0,.15)) brightness(.75) saturate(.5)':'drop-shadow(0 8px 16px rgba(0,0,0,.22))';
    }
  });

  // Kitchens
  G.cfg.kitchens.forEach(k=>{
    const kit=G.kitchens[k];
    if(kit.running){
      kit.tl-=TICK;
      const pct=Math.min(100,((kit.total-kit.tl)/kit.total)*100);
      [$('bpf-'+k),$('kpf-'+k)].forEach(b=>{if(b)b.style.width=pct+'%'});
      if(kit.tl<=0){
        kit.running=false;
        [$('bpf-'+k),$('kpf-'+k)].forEach(b=>{if(b)b.style.width='0%'});
        $('bldw-'+k)?.parentElement?.parentElement?.classList.remove('working');
        $('kc-'+k)?.classList.remove('working');
        addStorage(KITCHENS[k].out);
        popFx($('bld-'+k),KITCHENS[k].out+' готово!','#2abcaa');
        refreshSteps();
      }
    }
  });

  // Mopers animation
  G.mopers.forEach(m=>{
    if(m.busy&&m.tl>0){
      m.tl-=TICK;
      const el=$('mp-'+m.id);
      if(el){
        const pct=parseFloat(el.style.left||'22')+0.8;
        el.style.left=Math.min(110,pct)+'%';
      }
      if(m.tl<=0){
        m.busy=false;
        const leftPcts=['22%','46%'];
        const el=$('mp-'+m.id);
        if(el){el.style.left=m.leftPct||leftPcts[m.id];el.classList.remove('moving','glow');}
        const mb=$('mpb-'+m.id);if(mb)mb.textContent='Готов ✓';
      }
    }
  });

  // Orders tick
  let needRender=false;
  G.orders.forEach(o=>{
    if(!o.active)return;
    o.tl-=TICK/1000;
    if(o.tl<=0){
      o.active=false;G.ordersFailed++;needRender=true;refreshStars();
      setTimeout(()=>{if(G.running)spawnOrder();},2500);
    } else {
      const f=$('otf-'+o.id);
      if(f){const p=o.tl/o.maxTl*100;f.style.width=p+'%';f.classList.toggle('low',p<25);}
    }
  });
  if(needRender)renderOrders();
  if(G.orders.filter(o=>o.active).length<G.cfg.maxOrders&&Math.random()<.006)spawnOrder();
  checkAllDeliverable();
}

/* ══ INTERACTIONS ══ */
function tapSource(k){
  if(!G.running)return;
  const s=G.sources[k];if(s.cd>0)return;
  if(stUsed()>=stMax()){popFxXY(window.innerWidth*.5,50,'🧊 Склад полон!','#e8403a');return;}
  addStorage(SOURCES[k].out);
  s.cd=sCd(k);s.maxCd=s.cd;
  const rr=$('rr-'+k);if(rr)rr.classList.remove('show');
  const srcEl=$('src-'+k);
  if(srcEl){srcEl.style.filter='drop-shadow(0 6px 10px rgba(0,0,0,.15)) brightness(.75) saturate(.5)'}
  doParticles(srcEl,SOURCES[k].out);
  popFx(srcEl,SOURCES[k].out+' +1','#2abcaa');
  refreshSteps();
}

function tapKitchen(k){
  if(!G.running)return;
  const kit=G.kitchens[k];if(kit.running)return;
  const need1=KITCHENS[k].in,need2=KITCHENS[k].in2;
  if(!(G.storage[need1]>0)){popFxXY(window.innerWidth*.78,100,'Нужно '+need1,'#e8403a');return;}
  if(!(G.storage[need2]>0)){popFxXY(window.innerWidth*.78,100,'Нужно '+need2,'#e8403a');return;}
  removeStorage(need1,1);removeStorage(need2,1);
  kit.running=true;kit.tl=kTm(k);kit.total=kit.tl;
  $('bldw-'+k)?.parentElement?.parentElement?.classList.add('working');
  $('kc-'+k)?.classList.add('working');
  refreshSteps();
}

function tapMoper(id){
  if(!G.running)return;
  const m=G.mopers[id];if(m.busy)return;
  if(!G.selOrder){popFxXY(window.innerWidth*.5,90,'👆 Выбери заказ!','#f8c832');return;}
  const order=G.orders.find(o=>o.id===G.selOrder&&o.active);
  if(!order){G.selOrder=null;renderOrders();return;}
  if(!order.deliverable){popFxXY(window.innerWidth*.5,90,'❌ Не хватает!','#e8403a');return;}
  const need={};order.items.forEach(i=>need[i]=(need[i]||0)+1);
  Object.entries(need).forEach(([i,q])=>removeStorage(i,q));
  order.active=false;G.ordersOk++;G.coins+=order.reward;G.selOrder=null;
  refreshCoins();refreshStars();renderOrders();
  m.busy=true;m.tl=mTm();
  const el=$('mp-'+id);
  el?.classList.add('moving');
  if(G.orders.some(o=>o.active&&o.deliverable))el?.classList.add('glow');
  const mb=$('mpb-'+id);if(mb)mb.textContent='🏍 Едет!';
  popFxXY(window.innerWidth*.5,62,'+'+order.reward+'🪙','#f8c832');
  setTimeout(()=>{if(G.running)spawnOrder();},2200);
  refreshSteps();
}

function selectOrder(id){
  G.selOrder=G.selOrder===id?null:id;renderOrders();
  if(G.selOrder){
    const rm=G.mopers.find(m=>!m.busy);
    if(rm){const el=$('mp-'+rm.id);el?.classList.add('glow');setTimeout(()=>el?.classList.remove('glow'),2500);}
  }
  refreshSteps();
}

/* ══ STORAGE ══ */
function addStorage(item){G.storage[item]=(G.storage[item]||0)+1;renderFridge();checkAllDeliverable();}
function removeStorage(item,qty){G.storage[item]=(G.storage[item]||0)-qty;if(G.storage[item]<=0)delete G.storage[item];renderFridge();checkAllDeliverable();}
function renderFridge(){
  const max=stMax(),used=stUsed();
  const cnt=$('fridge-cnt');if(cnt)cnt.textContent=`(${used}/${max})`;
  const chips=$('fridge-chips');
  if(chips){
    const entries=Object.entries(G.storage).filter(([,v])=>v>0);
    chips.innerHTML=entries.length
      ?entries.map(([e,q])=>`<div class="fchip">${e}<span>×${q}</span></div>`).join('')
      :'<div class="fridge-empty">Пусто</div>';
  }
}

/* ══ ORDERS ══ */
function spawnOrder(){
  if(!G||G.orders.filter(o=>o.active).length>=G.cfg.maxOrders)return;
  const pi=Math.min(G.cfg.id-1,ORDER_POOLS.length-1);
  const avail=new Set([...G.cfg.sources.map(k=>SOURCES[k].out),...G.cfg.kitchens.map(k=>KITCHENS[k].out)]);
  const valid=ORDER_POOLS[pi].filter(t=>t.i.every(x=>avail.has(x)));
  if(!valid.length)return;
  const tmpl=valid[Math.floor(Math.random()*valid.length)];
  const dur=28+tmpl.i.length*10;
  G.orders.push({id:++G.oid,items:[...tmpl.i],reward:tmpl.r,tl:dur,maxTl:dur,active:true,deliverable:false});
  renderOrders();
}

function renderOrders(){
  const list=$('orders-list');list.innerHTML='';
  const active=G.orders.filter(o=>o.active);
  if(!active.length){list.innerHTML='<div style="color:rgba(42,26,14,.2);font-size:9px;font-weight:800;text-align:center;padding:12px">Ждём заказы...</div>';return;}
  active.forEach(o=>{
    checkDeliverable(o);
    const card=document.createElement('div');
    card.className='order-card'+(G.selOrder===o.id?' sel':o.deliverable?' ready':'');
    card.id='oc-'+o.id;card.onclick=()=>selectOrder(o.id);
    card.innerHTML=`
      <div class="oi-row">${o.items.map(item=>`<span class="oi ${(G.storage[item]||0)>0?'':'dim'}">${item}</span>`).join('')}</div>
      <div class="o-bottom"><div class="o-reward">🪙${o.reward}</div></div>
      <div class="o-tbar"><div class="o-tfill ${o.tl/o.maxTl<.25?'low':''}" id="otf-${o.id}" style="width:${o.tl/o.maxTl*100}%"></div></div>`;
    list.appendChild(card);
  });
  for(let i=active.length;i<G.cfg.maxOrders;i++)list.innerHTML+='<div class="o-ph">🍱</div>';
}

function checkDeliverable(o){
  const need={};o.items.forEach(i=>need[i]=(need[i]||0)+1);
  o.deliverable=Object.entries(need).every(([i,q])=>(G.storage[i]||0)>=q);
}
function checkAllDeliverable(){
  G.orders.forEach(o=>{if(o.active)checkDeliverable(o);});
  G.orders.filter(o=>o.active).forEach(o=>{
    const c=$('oc-'+o.id);if(!c)return;
    c.className='order-card'+(G.selOrder===o.id?' sel':o.deliverable?' ready':'');
    c.querySelectorAll('.oi').forEach((el,i)=>el.classList.toggle('dim',(G.storage[o.items[i]]||0)===0));
  });
  refreshSteps();
}

/* ══ HUD ══ */
function refreshHUD(){refreshTimer();refreshCoins();refreshStars();refreshSteps();}
function refreshTimer(){
  const el=$('hud-timer');if(!el)return;
  const m=Math.floor(G.timeLeft/60),s=Math.floor(G.timeLeft%60);
  el.textContent=m+':'+String(s).padStart(2,'0');
  el.classList.toggle('urgent',G.timeLeft<30);
}
function refreshCoins(){const el=$('hud-coins');if(el)el.textContent=G.coins;}
function refreshStars(){
  const n=calcStars();
  document.querySelectorAll('#hud-stars span').forEach((el,i)=>{
    el.textContent=i<n?'⭐':'☆';el.classList.toggle('on',i<n);
  });
}
function calcStars(){const g=G.cfg.goals;return G.coins>=g[2]?3:G.coins>=g[1]?2:G.coins>=g[0]?1:0;}
function refreshSteps(){
  if(!G)return;
  ['hs0','hs1','hs2','hs3'].forEach(id=>{const el=$(id);if(el)el.className='hstep';});
  const set=(i,cls)=>{const el=$('hs'+i);if(el)el.className='hstep '+cls;};
  const hasRes=stUsed()>0;
  const canKit=G.cfg.kitchens.some(k=>{const kit=KITCHENS[k];return(G.storage[kit.in]||0)>0&&(G.storage[kit.in2]||0)>0&&!G.kitchens[k].running;});
  const kitRun=Object.values(G.kitchens).some(k=>k.running);
  const hasReady=G.orders.some(o=>o.active&&o.deliverable);
  const hasSel=!!G.selOrder;
  if(!hasRes&&!kitRun)set(0,'active');
  else if(canKit){set(0,'done');set(1,'active');}
  else if(hasReady&&!hasSel){set(0,'done');set(1,'done');set(2,'active');}
  else if(hasSel){set(0,'done');set(1,'done');set(2,'done');set(3,'active');}
  else set(0,'done');
}

/* ══ FX ══ */
function popFx(el,t,c){
  if(!el)return;const r=el.getBoundingClientRect();
  popFxXY(r.left+r.width/2,r.top+10,t,c);
}
function popFxXY(x,y,t,c){
  const el=document.createElement('div');el.className='fx-pop';
  el.style.cssText=`left:${x-44}px;top:${y-10}px;color:${c};text-shadow:0 1px 3px rgba(0,0,0,.18)`;
  el.textContent=t;document.body.appendChild(el);
  setTimeout(()=>el.remove(),1350);
}
function doParticles(el){
  if(!el)return;const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  ['#2abcaa','#f8c832','#f4846a','#6cc83a','#e8403a','#88d8f8'].forEach((c,i)=>{
    const p=document.createElement('div');p.className='particle';
    const a=i*(360/6)*(Math.PI/180),d=42+Math.random()*38;
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${c};--d:translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px);animation-delay:${i*.04}s`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),860);
  });
}

/* ══ END GAME ══ */
function endGame(){
  if(G.ended)return;G.ended=true;G.running=false;clearInterval(G.tick);
  const stars=calcStars();
  S.stars[G.cfg.id]=Math.max(S.stars[G.cfg.id]||0,stars);
  S.coins+=G.coins;
  setTimeout(()=>showResult(stars),500);
}
function goMap(){
  if(G){G.running=false;clearInterval(G.tick);}
  showScreen('screen-map');initMap();
}

/* ══ RESULT / UPGRADE ══ */
function showResult(stars){
  $('upg-ttl').textContent=stars===0?'😔 Ещё раз!':stars===1?'👍 Пройден!':stars===2?'🎉 Отлично!':'🏆 Мастер суши!';
  document.querySelectorAll('#upg-stars .s-big').forEach((el,i)=>{
    el.className='s-big';
    setTimeout(()=>{el.textContent=i<stars?'⭐':'☆';if(i<stars)el.classList.add('on');},i*280);
  });
  $('stat-pills').innerHTML=`
    <div class="stat-pill"><div class="stat-v">🪙${G.coins}</div><div class="stat-l">Монет</div></div>
    <div class="stat-pill"><div class="stat-v">📦${G.ordersOk}</div><div class="stat-l">Доставлено</div></div>
    <div class="stat-pill"><div class="stat-v">❌${G.ordersFailed}</div><div class="stat-l">Просрочено</div></div>`;
  $('upg-coins').textContent=S.coins;
  buildUpgList();
  const nid=G.cfg.id+1,has=LEVELS.find(l=>l.id===nid);
  if(stars===0){$('btn-next').textContent='🔄 Ещё раз';$('btn-next').onclick=()=>startLevel(G.cfg.id);}
  else{$('btn-next').textContent=has?'Следующий →':'🗺 На карту';$('btn-next').onclick=()=>{showScreen('screen-map');initMap();};}
  showScreen('screen-upgrade');
}
function buildUpgList(){
  const list=$('upg-list');list.innerHTML='';
  list.innerHTML+='<div class="upg-section">🎣 Источники</div>';
  UPG_DEFS.forEach((u,idx)=>{
    const lv=S.upg[u.k]||1,maxed=lv>=u.m,cost=UCOSTS[lv],afford=S.coins>=cost;
    const dots=Array.from({length:u.m},(_,i)=>`<div class="udot ${i<lv?'on':''}"></div>`).join('');
    const row=document.createElement('div');
    row.className='upg-row'+(maxed?' maxed':!afford?' broke':'');
    row.innerHTML=`<div class="u-ico">${u.e}</div><div class="u-info"><div class="u-name">${u.n}</div><div class="u-sub">${u.d} · Lv${lv}${maxed?'':' → '+(lv+1)}</div><div class="u-dots">${dots}</div></div>${maxed?`<div class="u-max-lbl">МАКС ✓</div>`:`<div class="u-buy-btn" style="opacity:${afford?1:.35}"><div class="u-buy-v">🪙${cost}</div><div class="u-buy-l">Купить</div></div>`}`;
    if(!maxed&&afford){row.onclick=()=>{S.upg[u.k]++;S.coins-=cost;$('upg-coins').textContent=S.coins;$('map-coins').textContent=S.coins;buildUpgList();popFxXY(window.innerWidth*.72,170,'⬆️ '+u.n+' Lv'+(lv+1),'#2abcaa');};}
    list.appendChild(row);
    if(u.k==='garden')list.innerHTML+='<div class="upg-section" style="margin-top:5px">🏗️ Кухня и доставка</div>';
  });
}

/* ══ TUTORIAL ══ */
const TUTS=[
  {target:'src-fisher',title:'🎣 Тапни рыбака!',  text:'Рыбак на пирсе. Жди пока засветится кольцо — потом тапни, получишь 🐟!',dir:'right'},
  {target:'fridge-widget',title:'🧊 Холодильник', text:'Все ингредиенты хранятся тут. Следи чтобы не переполнить!',dir:'left'},
  {target:'kc-sushi',title:'🍣 Приготовь суши!',  text:'Нужны рыба 🐟 + рис 🍚. Тапни карточку кухни чтобы начать готовить!',dir:'left'},
  {target:'orders-list',title:'📋 Выбери заказ!', text:'Тапни карточку заказа. Когда есть всё — она светится зелёным!',dir:'right'},
  {target:'mp-0',title:'🛵 Доставляй!',           text:'Выбери заказ, потом тапни мопед — курьер помчится к клиенту!',dir:'top'},
];
let tutStep=0,tutEl=null;
function runTutorial(done){tutStep=0;showTut(done);}
function showTut(done){
  if(tutEl){tutEl.remove();tutEl=null;}
  if(tutStep>=TUTS.length){done();return;}
  const t=TUTS[tutStep];
  const ov=document.createElement('div');ov.className='tut-overlay';
  const bg=document.createElement('div');bg.className='tut-bg';ov.appendChild(bg);
  tutEl=ov;
  const target=$(t.target);
  let bx=window.innerWidth/2-110,by=window.innerHeight/2-90;
  if(target){
    const r=target.getBoundingClientRect();
    const hl=document.createElement('div');hl.className='tut-hl';
    hl.style.cssText=`top:${r.top-5}px;left:${r.left-5}px;width:${r.width+10}px;height:${r.height+10}px`;
    ov.appendChild(hl);
    if(t.dir==='right'){bx=r.right+10;by=r.top+r.height/2-80;}
    else if(t.dir==='left'){bx=r.left-240;by=r.top+r.height/2-80;}
    else{bx=r.left+r.width/2-110;by=r.top-185;}
    bx=Math.max(6,Math.min(window.innerWidth-236,bx));
    by=Math.max(6,Math.min(window.innerHeight-205,by));
  }
  const box=document.createElement('div');box.className='tut-box';
  const arr=t.dir==='top'?'👇':t.dir==='right'?'👈':'👉';
  box.innerHTML=`<span class="tut-arr">${arr}</span><div class="tut-ttl">${t.title}</div><div class="tut-txt">${t.text}</div><button class="tut-ok">${tutStep<TUTS.length-1?'Понял! →':'Поехали! 🍣'}</button>`;
  box.style.cssText=`left:${bx}px;top:${by}px`;
  box.querySelector('.tut-ok').onclick=()=>{tutStep++;showTut(done);};
  ov.appendChild(box);document.body.appendChild(ov);
}

/* ══ INIT ══ */
showScreen('screen-map');
initMap();
</script>
