<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌾 Order Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   ROOT & RESET
══════════════════════════════════════════ */
:root{
  --sky1:#74d7f7;--sky2:#b8ecff;--sky3:#d4f5a0;
  --grass1:#6ecf35;--grass2:#52b020;--grass3:#3a8a10;
  --dirt1:#c8893a;--dirt2:#a06820;
  --road1:#8a6840;--road2:#6a4820;
  --gold:#ffd700;--gold2:#ffb300;--gold3:#e65c00;
  --wood:#c89040;--wood2:#8a5a10;
  --panel-bg:rgba(20,60,5,0.82);
  --panel-border:rgba(120,200,40,0.35);
  --red:#e53935;--green:#43a047;--blue:#1e88e5;
  --text-light:#fffde7;--text-gold:#ffe082;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:'Nunito',sans-serif;background:#1a3a05}

/* ══════════════════════════════════════════
   PORTRAIT WARNING
══════════════════════════════════════════ */
.portrait-warn{
  display:none;position:fixed;inset:0;z-index:99999;
  background:linear-gradient(160deg,#1a4a0a,#0a2005);
  flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px;
}
@media(orientation:portrait){.portrait-warn{display:flex;}}
.pw-icon{font-size:72px;animation:rphone 2s ease-in-out infinite}
@keyframes rphone{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
.pw-title{font-family:'Lilita One',cursive;font-size:28px;color:var(--gold)}
.pw-sub{font-size:14px;color:rgba(255,255,255,.55);font-weight:700;line-height:1.7}

/* ══════════════════════════════════════════
   SCREENS
══════════════════════════════════════════ */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:opacity .3s,transform .3s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.98)}

/* ══════════════════════════════════════════
   MAP SCREEN
══════════════════════════════════════════ */
#screen-map{
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 40%,var(--sky3) 40%,var(--grass1) 60%,var(--grass3) 100%);
  overflow:hidden;
}
.map-header{
  position:relative;z-index:10;
  padding:14px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,.18),transparent);
}
.map-logo-wrap{display:flex;flex-direction:column}
.map-logo{font-family:'Lilita One',cursive;font-size:32px;color:#fff;text-shadow:0 3px 0 rgba(0,80,0,.5),0 6px 12px rgba(0,0,0,.3);line-height:1}
.map-logo-sub{font-size:10px;color:rgba(255,255,255,.55);font-weight:800;letter-spacing:2px;text-transform:uppercase}
.map-coin-badge{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(145deg,rgba(0,0,0,.45),rgba(0,0,0,.3));
  border:2px solid rgba(255,215,0,.4);border-radius:20px;
  padding:8px 16px;backdrop-filter:blur(8px);
}
.map-coin-icon{font-size:22px;filter:drop-shadow(0 2px 4px rgba(255,180,0,.6))}
.map-coin-val{font-family:'Lilita One',cursive;font-size:22px;color:var(--gold);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.map-coin-lbl{font-size:9px;color:rgba(255,255,255,.4);font-weight:800;text-transform:uppercase}

/* World banner */
.map-world-banner{
  position:relative;z-index:10;margin:0 20px;
  background:linear-gradient(145deg,rgba(0,0,0,.35),rgba(0,0,0,.2));
  border:2px solid rgba(255,255,255,.12);border-radius:16px;
  padding:8px 18px;backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:10px;
}
.map-world-title{font-family:'Lilita One',cursive;font-size:16px;color:#fff}
.map-world-sub{font-size:10px;color:rgba(255,255,255,.4);font-weight:800}

/* Map scroll */
.map-body{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.map-scroll{width:100%;overflow-x:auto;overflow-y:hidden;padding:20px 30px}
.map-scroll::-webkit-scrollbar{display:none}
.levels-path{display:flex;align-items:center;gap:0;position:relative;min-width:max-content}
.lv-connector{
  width:50px;height:6px;flex-shrink:0;
  background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.35),rgba(255,255,255,.2));
  border-radius:3px;position:relative;
}
.lv-connector::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);
}
.lv-node{
  width:90px;height:90px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;flex-shrink:0;
  transition:transform .15s,box-shadow .15s;
}
.lv-node:active{transform:scale(.9) translateY(4px)}
.lv-node.done{
  background:radial-gradient(circle at 35% 30%,#a8f080,#52c820,#3a9010);
  border:5px solid rgba(255,255,255,.7);
  box-shadow:0 8px 0 rgba(0,80,0,.4),0 10px 24px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5);
}
.lv-node.next{
  background:radial-gradient(circle at 35% 30%,#ffe88a,#ffc107,#e65c00);
  border:5px solid rgba(255,255,255,.8);
  box-shadow:0 8px 0 rgba(120,60,0,.5),0 10px 24px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5);
  animation:node-pulse 1.8s ease-in-out infinite;
}
.lv-node.locked{
  background:radial-gradient(circle at 35% 30%,#888,#555,#333);
  border:5px solid rgba(255,255,255,.3);
  box-shadow:0 6px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2);
  opacity:.65;cursor:default;
}
@keyframes node-pulse{
  0%,100%{box-shadow:0 8px 0 rgba(120,60,0,.5),0 0 0 0 rgba(255,193,7,.7)}
  50%{box-shadow:0 8px 0 rgba(120,60,0,.5),0 0 0 18px rgba(255,193,7,0)}
}
.lv-num{font-family:'Lilita One',cursive;font-size:30px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);line-height:1}
.lv-stars{display:flex;gap:1px;margin-top:2px}
.lv-stars span{font-size:13px}
.lv-node-shadow{
  width:70px;height:12px;margin-top:4px;
  background:radial-gradient(ellipse,rgba(0,0,0,.3),transparent);
  border-radius:50%;flex-shrink:0;
}

/* Map ground decorations */
.map-ground{position:absolute;bottom:0;left:0;right:0;height:42%;pointer-events:none;z-index:2}
.map-tree{position:absolute;bottom:0;font-size:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.map-cloud{position:absolute;animation:cloud-drift linear infinite;pointer-events:none}
@keyframes cloud-drift{from{transform:translateX(-150px)}to{transform:translateX(115vw)}}

/* ══════════════════════════════════════════
   GAME SCREEN
══════════════════════════════════════════ */
#screen-game{flex-direction:column;overflow:hidden}

/* ── TOP HUD ── */
.hud{
  height:52px;flex-shrink:0;position:relative;z-index:30;
  background:linear-gradient(180deg,rgba(10,40,2,.9),rgba(10,40,2,.7));
  border-bottom:2px solid rgba(100,200,40,.2);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:6px;padding:0 8px;
}
.hud-back{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(145deg,#ff7043,#d32f2f);
  border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;cursor:pointer;
  box-shadow:0 4px 0 #8b0000,0 5px 12px rgba(0,0,0,.3);
  transition:transform .12s,box-shadow .12s;
}
.hud-back:active{transform:translateY(3px);box-shadow:0 1px 0 #8b0000}
.hud-lvl{
  background:linear-gradient(145deg,#e8b86d,#c07820);
  border:2px solid #7a4e10;border-radius:12px;
  padding:4px 12px;font-family:'Lilita One',cursive;
  font-size:14px;color:#3a1500;
  box-shadow:0 3px 0 #5a3010;flex-shrink:0;
}
/* Steps */
.hud-steps{flex:1;display:flex;align-items:center;justify-content:center;gap:5px}
.step-pill{
  padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800;
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);
  border:1px solid rgba(255,255,255,.07);transition:all .3s;white-space:nowrap;
}
.step-pill.active{background:rgba(255,193,7,.3);color:#ffe082;border-color:rgba(255,193,7,.5);animation:spulse .9s ease-in-out infinite}
.step-pill.done{background:rgba(76,175,80,.2);color:#a5d6a7;border-color:rgba(76,175,80,.3)}
@keyframes spulse{0%,100%{opacity:1}50%{opacity:.55}}
.hud-sep{width:1px;height:28px;background:rgba(255,255,255,.1);flex-shrink:0}
/* Stars */
.hud-stars{display:flex;gap:3px;flex-shrink:0}
.hud-star{font-size:20px;filter:grayscale(1) opacity(.3);transition:filter .3s,transform .3s}
.hud-star.on{filter:none;animation:star-pop .4s ease}
@keyframes star-pop{0%{transform:scale(1)}50%{transform:scale(1.8)}100%{transform:scale(1)}}
/* Coins */
.hud-coins{
  display:flex;align-items:center;gap:4px;
  background:linear-gradient(145deg,#ffe566,#ffc107);
  border:2px solid #a06820;border-radius:14px;
  padding:4px 12px;font-size:15px;font-weight:900;color:#5a2e00;
  box-shadow:0 3px 0 #7a4e10;flex-shrink:0;
}
/* Timer */
.hud-timer{
  display:flex;align-items:center;gap:4px;
  background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.15);
  border-radius:14px;padding:4px 12px;
  font-family:'Lilita One',cursive;font-size:16px;color:#fff;
  min-width:80px;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.hud-timer.red{color:#ff6b6b;border-color:rgba(255,100,100,.4);animation:tblink .5s infinite}
@keyframes tblink{0%,100%{opacity:1}50%{opacity:.45}}

/* ── GAME BODY ── */
.game-body{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}

/* ── ORDERS PANEL (LEFT) ── */
.orders-panel{
  width:145px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(8,35,3,.88),rgba(12,45,5,.75));
  border-right:2px solid rgba(100,200,40,.18);
  display:flex;flex-direction:column;padding:8px 6px;gap:6px;
  z-index:10;backdrop-filter:blur(8px);
}
.panel-title{
  font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.35);text-align:center;
  padding:3px 0;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:2px;
}
.orders-list{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto}
.orders-list::-webkit-scrollbar{display:none}

/* Order card */
.order-card{
  background:linear-gradient(160deg,#fffef0,#fff5cc);
  border:3px solid #c8a030;border-radius:14px;
  padding:7px 8px;flex-shrink:0;cursor:pointer;position:relative;
  box-shadow:0 4px 0 #8a6010,0 6px 14px rgba(0,0,0,.25);
  transition:transform .12s,box-shadow .12s;
}
.order-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);
  border-radius:11px 11px 0 0;pointer-events:none;
}
.order-card:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6010}
.order-card.sel{
  border-color:#1e88e5;
  box-shadow:0 4px 0 #0d47a1,0 0 0 3px rgba(30,136,229,.45);
}
.order-card.ready{
  border-color:#43a047;
  box-shadow:0 4px 0 #1b5e20,0 0 0 3px rgba(67,160,71,.4);
  animation:card-bob .9s ease-in-out infinite;
}
@keyframes card-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.oi-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.oi{font-size:20px;transition:filter .2s,opacity .2s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.oi.dim{filter:grayscale(1);opacity:.25}
.o-reward{
  font-size:12px;font-weight:900;color:#7a4000;
  display:flex;align-items:center;gap:3px;
}
.o-tbar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;overflow:hidden;margin-top:4px}
.o-tfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#43a047,#8bc34a);transition:width .4s linear,background .4s}
.o-tfill.low{background:linear-gradient(90deg,#e53935,#ff7043)}
.o-ph{
  border:2px dashed rgba(255,255,255,.15);border-radius:14px;
  min-height:56px;display:flex;align-items:center;justify-content:center;
  font-size:20px;opacity:.2;
}

/* ── SCENE (CENTER) ── */
.scene-col{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scene{flex:1;position:relative;overflow:hidden;min-height:0}

/* Sky gradient */
.sky-bg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#5ac8f5 0%,#96e0ff 38%,#c0f080 38%,#80d840 55%,#5ab820 70%,#3a8a10 100%);
}
.sky-sun{
  position:absolute;top:8px;right:36px;width:44px;height:44px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 40% 38%,#fff9b0,#ffdf00,#ffa000);
  box-shadow:0 0 0 6px rgba(255,230,50,.18),0 0 0 14px rgba(255,220,50,.09),0 0 30px rgba(255,200,0,.6);
  animation:sun-pulse 4s ease-in-out infinite;
}
@keyframes sun-pulse{
  0%,100%{box-shadow:0 0 0 6px rgba(255,230,50,.18),0 0 0 14px rgba(255,220,50,.09),0 0 30px rgba(255,200,0,.6)}
  50%{box-shadow:0 0 0 10px rgba(255,230,50,.25),0 0 0 22px rgba(255,220,50,.1),0 0 50px rgba(255,200,0,.8)}
}
.scene-cloud{position:absolute;animation:cloud-drift linear infinite;pointer-events:none;z-index:3;font-size:28px}

/* Ground */
.ground-layer{position:absolute;left:0;right:0}

/* Fence top */
.scene-fence{position:absolute;left:0;right:0;z-index:5;pointer-events:none}

/* ── PADDOCK ── */
.paddock-obj{position:absolute;z-index:6}
.paddock-inner{
  position:relative;width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 65%,#80d840,#5ab820,#3a8a10);
  border-radius:8px;overflow:hidden;
}
.paddock-inner::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 8px);
}
.paddock-inner::after{
  content:'';position:absolute;bottom:8%;left:20%;right:20%;height:18%;
  background:radial-gradient(ellipse,rgba(0,0,0,.18),transparent);
  border-radius:50%;
}
.paddock-fence-border{
  position:absolute;inset:-6px;
  border:7px solid #c89040;border-radius:10px;
  box-shadow:0 0 0 2px #7a5010,inset 0 0 0 2px rgba(255,255,255,.1);
  pointer-events:none;z-index:2;
}
.fence-post{
  position:absolute;
  background:linear-gradient(90deg,#d4a840,#a07020);
  border:1.5px solid #7a5010;border-radius:3px;
  box-shadow:2px 0 5px rgba(0,0,0,.25);
}

/* Animals */
.animal-in-pad{
  position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;z-index:8;
}
.anim-bubble{
  border-radius:50%;border:4px solid rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.2);
  transition:transform .12s;position:relative;overflow:hidden;
}
.anim-bubble::before{
  content:'';position:absolute;top:5%;left:10%;width:30%;height:30%;
  background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0));
  border-radius:50%;pointer-events:none;
}
.anim-bubble:active{transform:scale(.85) translateY(3px)}
.anim-bubble.ready{animation:abounce .75s ease-in-out infinite}
@keyframes abounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.anim-bubble.cd{cursor:not-allowed}
.anim-cd-ov{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.45);pointer-events:none;
  transition:height .25s linear;border-radius:0 0 50% 50%;
}
.anim-lv-badge{
  position:absolute;top:-6px;right:-6px;
  background:linear-gradient(145deg,#ffe566,#ffc107);
  border:2px solid #a06820;border-radius:7px;
  padding:1px 5px;font-size:8px;font-weight:900;color:#5a2e00;
  box-shadow:0 2px 0 #7a4e10;z-index:5;
}
.anim-bar{height:5px;background:rgba(0,0,0,.2);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.anim-bar-fill{height:100%;background:linear-gradient(90deg,#43a047,#8bc34a);border-radius:3px;transition:width .25s linear}
.anim-name-tag{
  font-size:8px;font-weight:800;color:#fffde7;
  text-shadow:0 1px 4px rgba(0,0,0,.7);
  background:rgba(0,0,0,.35);border-radius:6px;padding:2px 6px;white-space:nowrap;
}

/* ── MACHINES PANEL (RIGHT) ── */
.machines-panel{
  width:145px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(8,35,3,.88),rgba(12,45,5,.75));
  border-left:2px solid rgba(100,200,40,.18);
  display:flex;flex-direction:column;padding:8px 6px;gap:6px;
  z-index:10;backdrop-filter:blur(8px);
}

/* ── BUILDING WIDGETS ── */

/* BARN */
.barn-widget{display:flex;flex-direction:column;align-items:center;gap:3px}
.barn-3d{width:110px;position:relative;cursor:default}
/* Roof */
.barn-roof-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.barn-roof-tri{
  width:0;height:0;
  border-left:55px solid transparent;
  border-right:55px solid transparent;
  border-bottom:32px solid #c03018;
  position:relative;z-index:2;
  filter:drop-shadow(0 -2px 4px rgba(0,0,0,.2));
}
.barn-roof-tri::after{
  content:'';position:absolute;top:8px;left:-42px;
  border-left:42px solid transparent;
  border-right:42px solid transparent;
  border-bottom:22px solid rgba(255,255,255,.12);
}
.barn-roof-band{
  height:10px;width:100%;
  background:linear-gradient(180deg,#d83820,#b02810);
  border-radius:0 0 5px 5px;
  border:2px solid rgba(0,0,0,.25);border-top:none;
  box-shadow:0 3px 0 rgba(0,0,0,.2);
}
/* Walls */
.barn-walls{
  height:62px;width:110px;
  background:linear-gradient(165deg,#e85c28,#c03818,#a02808);
  border:3px solid #7a2208;border-top:none;
  border-radius:0 0 6px 6px;position:relative;overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.3),inset 2px 0 0 rgba(255,255,255,.1);
}
.barn-walls::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.08) 0,rgba(0,0,0,.08) 1px,transparent 1px,transparent 10px);
}
.barn-walls::after{
  content:'';position:absolute;top:0;left:0;right:0;height:35%;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);
}
.barn-door{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:28px;height:42px;
  background:linear-gradient(165deg,#8a3808,#5a1800);
  border:2px solid #3a0a00;border-radius:4px 4px 0 0;z-index:2;
}
.barn-door::before{
  content:'';position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
  width:6px;height:6px;border-radius:50%;background:#c89040;
  box-shadow:0 0 4px rgba(200,140,0,.6);
}
.barn-door::after{
  content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);
  width:18px;height:1px;background:rgba(255,255,255,.1);
}
.barn-window{
  position:absolute;top:9px;
  width:16px;height:14px;
  background:linear-gradient(145deg,#a8d8ff,#6ab0e0);
  border:2px solid #3a0a00;border-radius:3px;z-index:2;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.barn-window::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.4) 0,transparent 60%);
  border-radius:2px;
}
.barn-shadow{
  height:10px;width:90px;
  background:radial-gradient(ellipse,rgba(0,0,0,.25),transparent);
  border-radius:50%;margin-top:3px;
}
.barn-lbl{
  font-size:9px;font-weight:900;color:rgba(255,255,255,.8);
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  background:rgba(0,0,0,.32);border-radius:7px;padding:2px 9px;
  white-space:nowrap;text-align:center;
}
.barn-items-row{
  display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px;
}
.barn-item-chip{
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);
  border-radius:9px;padding:2px 6px;font-size:13px;
  display:flex;align-items:center;gap:2px;
}
.barn-item-chip span{font-size:9px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}

/* MACHINE */
.machine-widget{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;transition:transform .12s;
}
.machine-widget:active .mach-3d{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)!important}
.mach-3d{
  width:108px;position:relative;
  border-radius:10px 10px 5px 5px;
  border:3px solid rgba(0,0,0,.3);
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.25);
  overflow:visible;transition:transform .12s,box-shadow .12s;
}
.mach-roof{
  height:16px;border-radius:8px 8px 0 0;
  border-bottom:2px solid rgba(0,0,0,.15);position:relative;
}
.mach-roof::after{
  content:'';position:absolute;inset:0;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);
}
.mach-body{
  height:62px;position:relative;overflow:hidden;
}
.mach-body::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 9px);
}
.mach-body::after{
  content:'';position:absolute;top:0;left:0;right:0;height:32%;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);
}
.mach-sign{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.95);border:1.5px solid rgba(0,0,0,.15);
  border-radius:7px;padding:3px 6px;
  font-size:10px;font-weight:900;color:#333;white-space:nowrap;z-index:2;
  box-shadow:0 2px 4px rgba(0,0,0,.15);
}
.mach-window{position:absolute;top:25px;background:linear-gradient(145deg,#a8d8ff,#6ab0e0);border:2px solid rgba(0,0,0,.25);border-radius:3px;width:14px;height:12px;z-index:2}
.mach-window::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.5) 0,transparent 60%);border-radius:2px}
.mach-window.l{left:7px}.mach-window.r{right:7px}
.mach-door{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:22px;height:32px;border:2px solid rgba(0,0,0,.3);border-radius:4px 4px 0 0;z-index:2;
}
.mach-prog-bar{
  position:absolute;bottom:0;left:0;right:0;height:7px;
  background:rgba(0,0,0,.25);border-radius:0 0 4px 4px;overflow:hidden;
}
.mach-prog-fill{height:100%;background:linear-gradient(90deg,#43a047,#8bc34a);transition:width .3s linear;border-radius:0 0 4px 4px}
/* chimney */
.chimney{
  position:absolute;top:-20px;width:12px;height:22px;
  background:linear-gradient(180deg,#777,#444);
  border-radius:3px 3px 0 0;border:1.5px solid #333;
  box-shadow:2px 0 4px rgba(0,0,0,.3);
}
.smoke-puff{
  position:absolute;border-radius:50%;
  background:rgba(210,210,210,.6);
  animation:smoke-up 2.2s ease-out infinite;
  pointer-events:none;
}
@keyframes smoke-up{
  0%{transform:translateX(-50%) scale(1);opacity:.6;margin-bottom:0}
  100%{transform:translateX(-50%) scale(3);opacity:0;margin-bottom:32px}
}
.mach-lv-badge{
  position:absolute;top:-7px;right:-7px;z-index:10;
  background:linear-gradient(145deg,#ffe566,#ffc107);
  border:2px solid #a06820;border-radius:8px;
  padding:1px 6px;font-size:8px;font-weight:900;color:#5a2e00;
  box-shadow:0 2px 0 #7a4e10;
}
.mach-shadow{height:8px;width:88px;background:radial-gradient(ellipse,rgba(0,0,0,.22),transparent);border-radius:50%;margin-top:3px}
.mach-lbl{font-size:9px;font-weight:900;color:rgba(255,255,255,.8);text-shadow:0 1px 4px rgba(0,0,0,.6);text-align:center;white-space:nowrap}
.mach-3d.working{
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 3px rgba(67,160,71,.55),0 0 20px rgba(67,160,71,.35);
}

/* ── TRUCKS ── */
.truck-obj{
  position:absolute;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:left .1s linear;z-index:9;
}
.truck-speech{
  background:rgba(255,255,255,.96);border:2px solid #c89040;
  border-radius:12px;padding:3px 10px;
  font-size:9px;font-weight:800;color:#5a2e00;
  box-shadow:0 3px 6px rgba(0,0,0,.2);white-space:nowrap;position:relative;
}
.truck-speech::after{
  content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:7px solid rgba(255,255,255,.96);
}
.truck-body-wrap{display:flex;align-items:flex-end}
/* Trailer */
.truck-trailer{
  width:64px;height:34px;
  background:linear-gradient(165deg,#e8c870,#c89840,#a07820);
  border:2.5px solid #7a5010;border-radius:5px 3px 3px 5px;
  box-shadow:0 5px 0 #5a3010,inset 0 2px 0 rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;position:relative;overflow:hidden;
}
.truck-trailer::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 13px);
}
.truck-trailer::after{
  content:'';position:absolute;top:0;left:0;right:0;height:38%;
  background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);
}
/* Cab */
.truck-cab{
  width:48px;height:38px;
  background:linear-gradient(165deg,#ef5350,#c62828,#8b0000);
  border:2.5px solid #6a0000;border-radius:7px 10px 5px 5px;
  position:relative;overflow:hidden;
  box-shadow:0 5px 0 #520000,inset 0 2px 0 rgba(255,255,255,.25);
}
/* windshield */
.truck-cab::before{
  content:'';position:absolute;top:5px;left:6px;right:6px;height:13px;
  background:linear-gradient(145deg,rgba(150,215,245,.85),rgba(100,180,220,.65));
  border-radius:4px;border:1px solid rgba(255,255,255,.3);
}
/* headlight */
.truck-cab::after{
  content:'';position:absolute;bottom:7px;right:5px;width:7px;height:7px;
  background:#ffe566;border-radius:2px;
  box-shadow:0 0 6px #ffd700,0 0 12px rgba(255,215,0,.5);
}
/* Wheels */
.truck-wheels{display:flex;justify-content:space-between;padding:0 5px;margin-top:2px}
.wheel{
  width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#666,#111);
  border:2.5px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 4px rgba(0,0,0,.4);
  animation:wspin .35s linear infinite;
}
@keyframes wspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wheel.stop{animation:none}
.truck-glow{filter:drop-shadow(0 0 8px rgba(255,193,7,1));animation:tglow .65s ease-in-out infinite}
@keyframes tglow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,193,7,.9))}50%{filter:drop-shadow(0 0 14px rgba(255,193,7,1))}}

/* ══════════════════════════════════════════
   UPGRADE SCREEN
══════════════════════════════════════════ */
#screen-upgrade{
  background:linear-gradient(155deg,#0d2a06,#071810);
  flex-direction:row;overflow:hidden;
}
.upg-left{
  width:270px;flex-shrink:0;
  background:linear-gradient(155deg,#163a08,#0d2a05);
  border-right:2px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;padding:18px;gap:12px;
}
.upg-headline{font-family:'Lilita One',cursive;font-size:26px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.upg-stars-row{display:flex;gap:10px;margin:4px 0}
.s-big{font-size:38px;filter:grayscale(1) opacity(.2);transition:filter .3s,transform .3s}
.s-big.on{filter:none;animation:spop .5s ease}
@keyframes spop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
.res-pills{display:flex;gap:8px;flex-wrap:wrap}
.rpill{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:7px 14px;text-align:center;
}
.rpill-v{font-family:'Lilita One',cursive;font-size:20px;color:var(--gold)}
.rpill-l{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px}
.upg-wallet{font-size:13px;font-weight:700;color:rgba(255,255,255,.35);margin-top:auto}
.upg-wallet strong{color:var(--gold);font-size:20px}
.btn-next{
  width:100%;padding:15px;
  background:linear-gradient(155deg,#66bb6a,#2e7d32);
  border:3px solid rgba(255,255,255,.25);border-radius:18px;
  font-family:'Lilita One',cursive;font-size:20px;color:#fff;cursor:pointer;
  box-shadow:0 6px 0 #1b5e20,0 8px 20px rgba(76,175,80,.35);
  transition:transform .12s,box-shadow .12s;
}
.btn-next:active{transform:translateY(5px);box-shadow:0 1px 0 #1b5e20}

.upg-right{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.upg-right::-webkit-scrollbar{display:none}
.upg-sec{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.18);margin:6px 0 3px}
.upg-card{
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08);
  border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:background .15s,transform .12s;
}
.upg-card:hover{background:rgba(255,255,255,.08)}
.upg-card:active{transform:scale(.97)}
.upg-card.off{opacity:.4;cursor:default}
.upg-card.broke{opacity:.5;cursor:default}
.u-ico{font-size:28px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.u-info{flex:1}
.u-name{font-size:13px;font-weight:900;color:#f1f5f9}
.u-sub{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px}
.u-dots{display:flex;gap:3px;margin-top:5px}
.udot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12)}
.udot.on{background:#ffc107}
.u-cost-btn{
  background:linear-gradient(155deg,#ffe566,#ffc107);
  border:2px solid #a06820;border-radius:11px;
  padding:6px 11px;box-shadow:0 3px 0 #7a4e10;
  cursor:pointer;text-align:center;flex-shrink:0;
  transition:transform .12s,box-shadow .12s;
}
.u-cost-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a4e10}
.u-cost-v{font-family:'Lilita One',cursive;font-size:15px;color:#5a2e00}
.u-cost-l{font-size:8px;color:rgba(90,46,0,.55)}
.u-max-lbl{font-size:10px;font-weight:800;color:rgba(255,255,255,.25);padding:6px 9px;flex-shrink:0}

/* ══════════════════════════════════════════
   TUTORIAL
══════════════════════════════════════════ */
.tut-overlay{position:fixed;inset:0;z-index:999;pointer-events:none}
.tut-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);pointer-events:all}
.tut-bubble{
  position:absolute;
  background:linear-gradient(155deg,#fffef0,#fff5d0);
  border:4px solid #c89040;border-radius:22px;
  padding:15px 17px;max-width:230px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  pointer-events:all;z-index:1;
  animation:bub-in .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes bub-in{from{transform:scale(.65) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}
.tut-arrow{font-size:26px;display:block;animation:arrbob .65s ease-in-out infinite;margin-bottom:5px}
@keyframes arrbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tut-title{font-family:'Lilita One',cursive;font-size:16px;color:#5a2e00;margin-bottom:6px}
.tut-text{font-size:11px;font-weight:700;color:#8a5000;line-height:1.7}
.tut-ok{
  margin-top:11px;width:100%;padding:9px;
  background:linear-gradient(155deg,#ffe566,#ffc107);
  border:2px solid #a06820;border-radius:11px;
  font-family:'Lilita One',cursive;font-size:15px;color:#5a2e00;
  cursor:pointer;box-shadow:0 4px 0 #7a4e10;
  transition:transform .12s,box-shadow .12s;
}
.tut-ok:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4e10}
.tut-highlight{
  position:absolute;border:3px solid #ffd700;border-radius:14px;
  box-shadow:0 0 0 5px rgba(255,215,0,.35),0 0 22px rgba(255,215,0,.5);
  pointer-events:none;z-index:2;
  animation:hl-pulse 1s ease-in-out infinite;
}
@keyframes hl-pulse{
  0%,100%{box-shadow:0 0 0 5px rgba(255,215,0,.35),0 0 22px rgba(255,215,0,.5)}
  50%{box-shadow:0 0 0 10px rgba(255,215,0,0),0 0 32px rgba(255,215,0,.7)}
}

/* ══════════════════════════════════════════
   FX FLOATERS
══════════════════════════════════════════ */
.fx{
  position:fixed;pointer-events:none;z-index:9999;
  font-family:'Lilita One',cursive;font-size:20px;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
  animation:fxup 1.4s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes fxup{
  0%{opacity:1;transform:translateY(0) scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:translateY(-75px) scale(.65)}
}
/* Particle */
.particle{
  position:fixed;pointer-events:none;z-index:9998;
  width:8px;height:8px;border-radius:50%;
  animation:part-fly 0.9s ease-out forwards;
}
@keyframes part-fly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:var(--fly) scale(0)}
}
</style>
</head>

const UPG=[
  {k:'cow',   e:'🐄',n:'Корова',   d:'Быстрее даёт молоко',m:5},
  {k:'chicken',e:'🐔',n:'Курица',  d:'Быстрее даёт яйца',  m:5},
  {k:'field', e:'🌾',n:'Поле',     d:'Быстрее растёт зерно',m:5},
  {k:'dairy', e:'🏭',n:'Молочный завод',d:'Быстрее делает сыр',m:5},
  {k:'bakery',e:'🥐',n:'Пекарня',  d:'Быстрее делает кексы',m:5},
  {k:'truck', e:'🚚',n:'Грузовик', d:'Быстрее доставляет',  m:5},
  {k:'storage',e:'📦',n:'Склад',   d:'Больше места',        m:5},
];
const UCOSTS=[0,150,280,450,650,900];

/* ═══ STATE ═══ */
const S={coins:0,stars:{},upg:{cow:1,chicken:1,field:1,dairy:1,bakery:1,truck:1,storage:1}};
let G=null;

/* ═══ HELPERS ═══ */
const aCd=k=>Math.max(1500,ANIM[k].baseCd-(S.upg[k]-1)*1200);
const mTm=k=>Math.max(3000,MACH[k].baseTime-(S.upg[k]-1)*2000);
const trTm=()=>Math.max(1500,6000-(S.upg.truck-1)*1100);
const stMax=()=>6+(S.upg.storage-1)*4;
const stUsed=()=>Object.values(G.storage).reduce((a,b)=>a+b,0);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById('screen-'+id).classList.remove('hidden')};

/* ═══ MAP ═══ */
function renderMap(){
  document.getElementById('map-coins').textContent=S.coins;

  // clouds
  const cl=document.getElementById('map-clouds-layer');cl.innerHTML='';
  ['☁️','⛅','☁️','⛅','☁️'].forEach((c,i)=>{
    const el=document.createElement('div');el.className='map-cloud';
    el.style.cssText=`top:${4+Math.random()*28}%;font-size:${28+Math.random()*22}px;animation-duration:${22+i*7}s;animation-delay:-${Math.random()*30}s`;
    el.textContent=c;cl.appendChild(el);
  });

  // trees
  const gd=document.getElementById('map-ground');gd.innerHTML='';
  const trees=['🌳','🌲','🌳','🌲','🌳','🌲','🌳'];
  trees.forEach((t,i)=>{
    const el=document.createElement('div');el.className='map-tree';
    el.style.cssText=`left:${(i/(trees.length-1))*90+5}%;bottom:0;font-size:${40+Math.random()*18}px`;
    el.textContent=t;gd.appendChild(el);
  });

  // levels
  const path=document.getElementById('levels-path');path.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    if(i>0){
      const conn=document.createElement('div');conn.className='lv-connector';path.appendChild(conn);
    }
    const stars=S.stars[lv.id]||0;
    const unlocked=lv.id<=nextUnlocked();
    const isCur=lv.id===nextUnlocked();
    const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:0';
    const node=document.createElement('div');
    node.className='lv-node '+(stars>0?'done':isCur?'next':'locked');
    let sh='';for(let s=1;s<=3;s++)sh+=`<span>${s<=stars?'⭐':'☆'}</span>`;
    node.innerHTML=stars>0||isCur?`<div class="lv-num">${lv.id}</div><div class="lv-stars">${sh}</div>`:`<span style="font-size:26px">🔒</span>`;
    if(unlocked)node.onclick=()=>startLevel(lv.id);
    const shadow=document.createElement('div');shadow.className='lv-node-shadow';
    wrap.appendChild(node);wrap.appendChild(shadow);
    path.appendChild(wrap);
  });
}
const nextUnlocked=()=>{for(const l of LEVELS)if(!(S.stars[l.id]>0))return l.id;return LEVELS[LEVELS.length-1].id};

/* ═══ START LEVEL ═══ */
function startLevel(id){
  const cfg=LEVELS.find(l=>l.id===id);if(!cfg)return;
  G={cfg,running:false,ended:false,timeLeft:cfg.time,coins:0,ordersOk:0,ordersFailed:0,
     storage:{},orders:[],oid:0,animals:{},machines:{},
     trucks:[{id:0,busy:false,tl:0,x:30},{id:1,busy:false,tl:0,x:0}],
     selOrder:null,tick:null};
  cfg.animals.forEach(k=>G.animals[k]={cd:0,maxCd:aCd(k)});
  cfg.machines.forEach(k=>G.machines[k]={running:false,tl:0,total:mTm(k)});
  buildScene();show('game');
  setTimeout(()=>{
    spawnOrder();spawnOrder();
    if(id===1)runTutorial(()=>beginGame());else beginGame();
  },300);
}

/* ═══ BUILD SCENE ═══ */
function buildScene(){
  const cfg=G.cfg;
  document.getElementById('hud-lvl').textContent='Ур.'+cfg.id;
  refreshTimer();refreshCoins();refreshStars();

  const scene=document.getElementById('scene');
  const SW=scene.offsetWidth||600,SH=scene.offsetHeight||220;

  // clouds
  const sc=document.getElementById('scene-clouds');sc.innerHTML='';
  [{c:'☁️',t:4,fs:28,d:20},{c:'⛅',t:12,fs:22,d:30},{c:'☁️',t:7,fs:20,d:38}].forEach((cl,i)=>{
    const el=document.createElement('div');el.className='scene-cloud';
    el.textContent=cl.c;el.style.cssText=`top:${cl.t}px;font-size:${cl.fs}px;animation-duration:${cl.d}s;animation-delay:-${i*9}s`;
    sc.appendChild(el);
  });

  const sl=document.getElementById('scene-layers');sl.innerHTML='';
  const grassH=Math.round(SH*0.36);
  const dirtH=Math.round(SH*0.17);
  const roadH=Math.round(SH*0.28);

  // Hills SVG
  const hills=document.createElement('div');
  hills.style.cssText=`position:absolute;bottom:${roadH+dirtH+grassH-22}px;left:0;right:0;height:55px;z-index:3;pointer-events:none`;
  hills.innerHTML=`<svg viewBox="0 0 ${SW} 55" preserveAspectRatio="none" style="width:100%;height:100%">
    <defs>
      <linearGradient id="hg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#70d840" stop-opacity=".85"/><stop offset="100%" stop-color="#50b020" stop-opacity=".7"/></linearGradient>
      <linearGradient id="hg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#58c028"/><stop offset="100%" stop-color="#3a9010" stop-opacity=".8"/></linearGradient>
    </defs>
    <ellipse cx="${SW*.12}" cy="60" rx="${SW*.18}" ry="44" fill="url(#hg2)"/>
    <ellipse cx="${SW*.53}" cy="65" rx="${SW*.24}" ry="40" fill="url(#hg1)"/>
    <ellipse cx="${SW*.88}" cy="62" rx="${SW*.16}" ry="38" fill="url(#hg2)"/>
  </svg>`;
  sl.appendChild(hills);

  // Grass
  const grass=document.createElement('div');
  grass.className='ground-layer';
  grass.style.cssText=`bottom:${roadH+dirtH}px;height:${grassH}px;background:linear-gradient(180deg,#6dcf38,#52b020,#3a8a10);z-index:4`;
  sl.appendChild(grass);

  // Dirt
  const dirt=document.createElement('div');
  dirt.className='ground-layer';
  dirt.style.cssText=`bottom:${roadH}px;height:${dirtH}px;background:linear-gradient(180deg,#c8893a,#a06820,#7a4a10);z-index:4`;
  sl.appendChild(dirt);

  // Road
  const road=document.createElement('div');
  road.className='ground-layer';
  road.style.cssText=`bottom:0;height:${roadH}px;background:linear-gradient(180deg,#8a6840,#6a4820,#4a2800);z-index:4;border-top:3px solid rgba(255,255,255,.1)`;
  // Road dashes
  road.innerHTML=`<div style="position:absolute;top:50%;left:0;right:0;height:5px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0,rgba(255,255,255,.45) 22px,transparent 22px,transparent 46px);border-radius:3px"></div>`;
  sl.appendChild(road);

  // Fence on grass top
  const fence=document.createElement('div');
  fence.className='scene-fence';
  fence.style.cssText=`bottom:${roadH+dirtH+grassH-5}px;height:18px;z-index:5`;
  fence.innerHTML=`<svg viewBox="0 0 ${SW} 18" preserveAspectRatio="none" style="width:100%;height:100%">
    <rect y="4" width="${SW}" height="4" rx="2" fill="#c89040" stroke="#7a4e10" stroke-width="1"/>
    <rect y="10" width="${SW}" height="4" rx="2" fill="#b07828" stroke="#7a4e10" stroke-width="1"/>
    ${Array.from({length:Math.ceil(SW/55)},(_,i)=>`<rect x="${i*55+8}" y="0" width="9" height="18" rx="3" fill="#d4a840" stroke="#7a4e10" stroke-width="1.5"/>`).join('')}
  </svg>`;
  sl.appendChild(fence);

  // ── PADDOCK ──
  const padW=Math.min(SW*0.42,210);
  const padH=grassH+dirtH-12;
  const padX=Math.round(SW/2-padW/2);
  const padBottom=roadH;

  const pw=document.getElementById('paddock-wrap');pw.innerHTML='';
  const pad=document.createElement('div');
  pad.className='paddock-obj';pad.id='paddock';
  pad.style.cssText=`left:${padX}px;bottom:${padBottom}px;width:${padW}px;height:${padH}px;z-index:6`;
  const inner=document.createElement('div');inner.className='paddock-inner';
  inner.innerHTML=`<div class="paddock-fence-border"></div>${buildFencePosts(padW,padH)}`;
  pad.appendChild(inner);
  pw.appendChild(pad);

  // Animals
  const anPos={
    1:[{l:'50%',b:'32%',tx:'-50%'}],
    2:[{l:'28%',b:'30%',tx:'-50%'},{l:'68%',b:'35%',tx:'-50%'}],
    3:[{l:'18%',b:'28%',tx:'-50%'},{l:'50%',b:'38%',tx:'-50%'},{l:'78%',b:'26%',tx:'-50%'}],
  };
  const positions=anPos[cfg.animals.length]||anPos[2];
  cfg.animals.forEach((k,i)=>{
    const a=ANIM[k];const pos=positions[i]||{l:'50%',b:'30%',tx:'-50%'};
    const sz=a.sz;
    const aDiv=document.createElement('div');
    aDiv.className='animal-in-pad';aDiv.id='aip-'+k;
    aDiv.style.cssText=`left:${pos.l};bottom:${pos.b};transform:translateX(${pos.tx})`;
    aDiv.innerHTML=`
      <div class="anim-bubble ready" id="ab-${k}" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.55)}px;background:${a.bg}">
        ${a.e}
        <div class="anim-cd-ov" id="acd-${k}" style="height:0%"></div>
        <div class="anim-lv-badge">Lv${S.upg[k]}</div>
      </div>
      <div style="width:${sz-6}px">
        <div class="anim-bar"><div class="anim-bar-fill" id="acf-${k}" style="width:100%"></div></div>
      </div>
      <div class="anim-name-tag">${a.outN}</div>`;
    aDiv.querySelector('.anim-bubble').addEventListener('click',()=>tapAnimal(k));
    inner.appendChild(aDiv);
  });

  // ── MACHINES PANEL ──
  const mp=document.getElementById('machines-panel');
  mp.querySelectorAll('.machine-widget,.barn-widget').forEach(e=>e.remove());
  cfg.machines.forEach(k=>mp.appendChild(buildMachWidget(k)));
  mp.appendChild(buildBarnWidget());

  // ── TRUCKS ──
  buildTrucks(roadH);
}

function buildFencePosts(w,h){
  const posts=[];
  const step=Math.max(28,Math.round(w/5));
  for(let x=0;x<=w;x+=step){
    posts.push(`<div class="fence-post" style="left:${x-4}px;top:5px;height:${h-8}px;width:9px"></div>`);
  }
  return posts.join('');
}

function buildMachWidget(k){
  const m=MACH[k],lv=S.upg[k];
  const div=document.createElement('div');
  div.className='machine-widget';div.id='mw-'+k;
  div.innerHTML=`
    <div class="mach-3d" id="m3d-${k}" style="background:${m.color}">
      <div class="chimney" style="${k==='dairy'?'right:16px':'left:16px'}">
        <div class="smoke-puff" style="width:9px;height:9px;left:50%;bottom:9px;animation-delay:0s"></div>
        <div class="smoke-puff" style="width:7px;height:7px;left:50%;bottom:9px;animation-delay:.75s"></div>
      </div>
      <div class="mach-roof" style="background:linear-gradient(145deg,${m.roofColor},${m.color})"></div>
      <div class="mach-body" style="background:linear-gradient(165deg,${m.color},${m.roofColor})">
        <div class="mach-sign">${m.in}→${m.out}</div>
        <div class="mach-window l"></div>
        <div class="mach-window r"></div>
        <div class="mach-door" style="background:${m.doorColor}"></div>
        <div class="mach-prog-bar"><div class="mach-prog-fill" id="mpf-${k}" style="width:0%"></div></div>
      </div>
      <div class="mach-lv-badge">Lv${lv}</div>
    </div>
    <div class="mach-shadow"></div>
    <div class="mach-lbl">${m.n}</div>`;
  div.querySelector('.mach-3d').addEventListener('click',()=>tapMachine(k));
  return div;
}

function buildBarnWidget(){
  const div=document.createElement('div');div.className='barn-widget';div.id='barn-widget';
  div.innerHTML=`
    <div class="barn-3d">
      <div class="barn-roof-wrap">
        <div class="barn-roof-tri"></div>
        <div class="barn-roof-band"></div>
      </div>
      <div class="barn-walls">
        <div class="barn-door"></div>
        <div class="barn-window" style="left:9px"></div>
        <div class="barn-window" style="right:9px"></div>
        <div style="position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:13px;z-index:3">⭐</div>
      </div>
    </div>
    <div class="barn-shadow"></div>
    <div class="barn-items-row" id="barn-items"></div>
    <div class="barn-lbl" id="barn-lbl">📦 Склад (0/${stMax()})</div>`;
  return div;
}

function buildTrucks(roadH){
  const tw=document.getElementById('trucks-wrap');tw.innerHTML='';
  const scene=document.getElementById('scene');
  const SW=scene.offsetWidth||600;
  const startXs=[SW*0.06,SW*0.52];
  G.trucks.forEach((t,i)=>{
    t.x=startXs[i];
    const div=document.createElement('div');div.className='truck-obj';div.id='tr-'+t.id;
    div.style.cssText=`left:${t.x}px;bottom:${Math.round(roadH*0.12)}px`;
    div.innerHTML=`
      <div class="truck-speech" id="trb-${t.id}">Готов ✓</div>
      <div class="truck-body-wrap">
        <div class="truck-trailer" id="trt-${t.id}">📦</div>
        <div class="truck-cab"></div>
      </div>
      <div class="truck-wheels">
        <div class="wheel stop" id="tw-${t.id}-0"></div>
        <div class="wheel stop" id="tw-${t.id}-1"></div>
        <div class="wheel stop" id="tw-${t.id}-2"></div>
      </div>`;
    div.addEventListener('click',()=>tapTruck(t.id));
    tw.appendChild(div);
  });
}

/* ═══ GAME LOOP ═══ */
const TICK=200;
function beginGame(){G.running=true;G.tick=setInterval(gameTick,TICK)}

function gameTick(){
  if(!G.running)return;
  G.timeLeft-=TICK/1000;
  if(G.timeLeft<=0){G.timeLeft=0;endGame();return;}
  refreshTimer();

  G.cfg.animals.forEach(k=>{
    const an=G.animals[k];
    if(an.cd>0){
      an.cd=Math.max(0,an.cd-TICK);
      const pct=100-(an.cd/an.maxCd*100);
      const bar=document.getElementById('acf-'+k);
      const ov=document.getElementById('acd-'+k);
      const btn=document.getElementById('ab-'+k);
      if(bar)bar.style.width=pct+'%';
      if(ov)ov.style.height=(an.cd>0?(an.cd/an.maxCd*52)+'%':'0%');
      if(btn){btn.classList.toggle('cd',an.cd>0);btn.classList.toggle('ready',an.cd===0);}
    }
  });

  G.cfg.machines.forEach(k=>{
    const m=G.machines[k];
    if(m.running){
      m.tl-=TICK;
      const pct=((m.total-m.tl)/m.total)*100;
      const bar=document.getElementById('mpf-'+k);
      if(bar)bar.style.width=Math.min(100,pct)+'%';
      if(m.tl<=0){
        m.running=false;if(bar)bar.style.width='0%';
        document.getElementById('m3d-'+k)?.classList.remove('working');
        addStorage(MACH[k].out);
        fxEl(document.getElementById('mw-'+k),MACH[k].out+' готово!','#43a047');
        refreshSteps();
      }
    }
  });

  const scene=document.getElementById('scene');
  const SW=scene.offsetWidth||600;
  G.trucks.forEach(t=>{
    if(t.busy&&t.tl>0){
      t.tl-=TICK;
      t.x=Math.min(SW+90,t.x+5);
      const el=document.getElementById('tr-'+t.id);
      if(el)el.style.left=t.x+'px';
      if(t.tl<=0){
        t.busy=false;
        const startXs=[SW*0.06,SW*0.52];
        t.x=startXs[t.id];
        if(el){el.style.left=t.x+'px';el.classList.remove('truck-glow');
          el.querySelectorAll('.wheel').forEach(w=>w.classList.add('stop'));}
        const tb=document.getElementById('trb-'+t.id);if(tb)tb.textContent='Готов ✓';
        const tt=document.getElementById('trt-'+t.id);if(tt)tt.textContent='📦';
      }
    }
  });

  let rerender=false;
  G.orders.forEach(o=>{
    if(!o.active)return;
    o.tl-=TICK/1000;
    if(o.tl<=0){o.active=false;G.ordersFailed++;rerender=true;refreshStars();setTimeout(()=>{if(G.running)spawnOrder();},2500);}
    else{const f=document.getElementById('otf-'+o.id);if(f){const p=(o.tl/o.maxTl)*100;f.style.width=p+'%';f.classList.toggle('low',p<25);}}
  });
  if(rerender)renderOrders();
  const activeCount=G.orders.filter(o=>o.active).length;
  if(activeCount<G.cfg.maxOrders&&Math.random()<0.006)spawnOrder();
  checkAllDeliv();
}

/* ═══ INTERACTIONS ═══ */
function tapAnimal(k){
  if(!G.running)return;
  const an=G.animals[k];if(an.cd>0)return;
  if(stUsed()>=stMax()){fxXY(window.innerWidth*.5,60,'📦 Склад полон!','#e53935');return;}
  addStorage(ANIM[k].out);
  an.cd=aCd(k);an.maxCd=an.cd;
  const btn=document.getElementById('ab-'+k);if(btn)btn.classList.remove('ready');
  spawnParticles(document.getElementById('aip-'+k),ANIM[k].out);
  fxEl(document.getElementById('aip-'+k),ANIM[k].out+' +1','#43a047');
  refreshSteps();
}

function tapMachine(k){
  if(!G.running)return;
  const m=G.machines[k];if(m.running)return;
  const need=MACH[k].in;
  if(!(G.storage[need]>0)){fxXY(window.innerWidth*.72,120,'Нужно '+need,'#e53935');return;}
  removeStorage(need,1);
  m.running=true;m.tl=mTm(k);m.total=m.tl;
  document.getElementById('m3d-'+k)?.classList.add('working');
  refreshSteps();
}

function tapTruck(id){
  if(!G.running)return;
  const truck=G.trucks[id];if(truck.busy)return;
  if(!G.selOrder){fxXY(window.innerWidth*.5,100,'👆 Сначала выбери заказ!','#ffc107');return;}
  const order=G.orders.find(o=>o.id===G.selOrder&&o.active);
  if(!order){G.selOrder=null;renderOrders();return;}
  if(!order.deliverable){fxXY(window.innerWidth*.5,100,'❌ Не хватает товаров!','#e53935');return;}
  const need={};order.items.forEach(i=>need[i]=(need[i]||0)+1);
  Object.entries(need).forEach(([i,q])=>removeStorage(i,q));
  order.active=false;G.ordersOk++;G.coins+=order.reward;G.selOrder=null;
  refreshCoins();refreshStars();renderOrders();
  truck.busy=true;truck.tl=trTm();
  const el=document.getElementById('tr-'+id);
  el?.classList.remove('truck-glow');
  el?.querySelectorAll('.wheel').forEach(w=>w.classList.remove('stop'));
  const tb=document.getElementById('trb-'+id);if(tb)tb.textContent='🛣️ Едет!';
  const tt=document.getElementById('trt-'+id);if(tt)tt.textContent=order.items[0]||'📦';
  fxXY(window.innerWidth*.5,75,'+'+order.reward+'🪙','#ffc107');
  fxXY(window.innerWidth*.5,108,'✅ Доставлено!','#43a047');
  setTimeout(()=>{if(G.running)spawnOrder();},2200);
  refreshSteps();
}

function selectOrder(id){
  G.selOrder=G.selOrder===id?null:id;
  renderOrders();
  if(G.selOrder){
    const rt=G.trucks.find(t=>!t.busy);
    if(rt){const el=document.getElementById('tr-'+rt.id);el?.classList.add('truck-glow');setTimeout(()=>el?.classList.remove('truck-glow'),2500);}
  }
  refreshSteps();
}

/* ═══ STORAGE ═══ */
function addStorage(item){G.storage[item]=(G.storage[item]||0)+1;renderBarn();checkAllDeliv();}
function removeStorage(item,qty){G.storage[item]=(G.storage[item]||0)-qty;if(G.storage[item]<=0)delete G.storage[item];renderBarn();checkAllDeliv();}
function renderBarn(){
  const max=stMax(),used=stUsed();
  const lbl=document.getElementById('barn-lbl');if(lbl)lbl.textContent=`📦 Склад (${used}/${max})`;
  const items=document.getElementById('barn-items');
  if(items)items.innerHTML=Object.entries(G.storage).filter(([,v])=>v>0)
    .map(([e,q])=>`<div class="barn-item-chip">${e}<span>×${q}</span></div>`).join('');
}

/* ═══ ORDERS ═══ */
function spawnOrder(){
  if(G.orders.filter(o=>o.active).length>=G.cfg.maxOrders)return;
  const pi=Math.min(G.cfg.id-1,ORDER_POOLS.length-1);
  const prod=new Set([...G.cfg.animals.map(k=>ANIM[k].out),...G.cfg.machines.map(k=>MACH[k].out)]);
  const valid=ORDER_POOLS[pi].filter(t=>t.i.every(x=>prod.has(x)));
  if(!valid.length)return;
  const tmpl=valid[Math.floor(Math.random()*valid.length)];
  const dur=28+tmpl.i.length*10;
  G.orders.push({id:++G.oid,items:[...tmpl.i],reward:tmpl.r,tl:dur,maxTl:dur,active:true,deliverable:false});
  renderOrders();
}

function renderOrders(){
  const list=document.getElementById('orders-list');list.innerHTML='';
  const active=G.orders.filter(o=>o.active);
  if(!active.length){
    list.innerHTML='<div style="color:rgba(255,255,255,.25);font-size:11px;font-weight:800;text-align:center;padding:12px">Ожидаем...</div>';
    return;
  }
  active.forEach(o=>{
    checkDeliv(o);
    const isSel=G.selOrder===o.id;
    const itemsHtml=o.items.map(item=>`<span class="oi ${(G.storage[item]||0)>0?'':'dim'}">${item}</span>`).join('');
    const card=document.createElement('div');
    card.className='order-card'+(isSel?' sel':'')+(o.deliverable&&!isSel?' ready':'');
    card.id='oc-'+o.id;card.onclick=()=>selectOrder(o.id);
    card.innerHTML=`<div class="oi-row">${itemsHtml}</div><div class="o-reward">🪙${o.reward}</div><div class="o-tbar"><div class="o-tfill" id="otf-${o.id}" style="width:${o.tl/o.maxTl*100}%"></div></div>`;
    list.appendChild(card);
  });
  for(let i=active.length;i<G.cfg.maxOrders;i++)list.innerHTML+='<div class="o-ph">📋</div>';
}

function checkDeliv(o){
  const need={};o.items.forEach(i=>need[i]=(need[i]||0)+1);
  o.deliverable=Object.entries(need).every(([i,q])=>(G.storage[i]||0)>=q);
}
function checkAllDeliv(){
  G.orders.forEach(o=>{if(o.active)checkDeliv(o);});
  G.orders.filter(o=>o.active).forEach(o=>{
    const c=document.getElementById('oc-'+o.id);if(!c)return;
    c.classList.toggle('ready',o.deliverable&&G.selOrder!==o.id);
    c.classList.toggle('sel',G.selOrder===o.id);
    c.querySelectorAll('.oi').forEach((el,i)=>el.classList.toggle('dim',(G.storage[o.items[i]]||0)===0));
  });
  refreshSteps();
}

/* ═══ DISPLAY ═══ */
function refreshTimer(){
  const el=document.getElementById('hud-timer');
  const m=Math.floor(G.timeLeft/60),s=Math.floor(G.timeLeft%60);
  el.textContent='⏱'+m+':'+String(s).padStart(2,'0');
  el.classList.toggle('red',G.timeLeft<30);
}
function refreshCoins(){document.getElementById('hud-coins').textContent=G.coins;}
function refreshStars(){
  const n=calcStars();
  document.querySelectorAll('#hud-stars .hud-star').forEach((el,i)=>{el.textContent=i<n?'⭐':'☆';el.classList.toggle('on',i<n);});
}
function calcStars(){const g=G.cfg.goals;return G.coins>=g[2]?3:G.coins>=g[1]?2:G.coins>=g[0]?1:0;}
function refreshSteps(){
  if(!G)return;
  [0,1,2,3].forEach(i=>{const el=document.getElementById('sp'+i);if(el)el.className='step-pill';});
  const hasRes=Object.values(G.storage||{}).some(v=>v>0);
  const canMach=G.cfg.machines.some(k=>MACH[k]&&(G.storage[MACH[k].in]||0)>0&&!G.machines[k].running);
  const machRun=Object.values(G.machines||{}).some(m=>m.running);
  const hasReady=G.orders.some(o=>o.active&&o.deliverable);
  const hasSel=!!G.selOrder;
  const set=(i,cls)=>{const el=document.getElementById('sp'+i);if(el)el.className='step-pill '+cls;};
  if(!hasRes&&!machRun){set(0,'active');}
  else if(canMach){set(0,'done');set(1,'active');}
  else if(hasReady&&!hasSel){set(0,'done');set(1,'done');set(2,'active');}
  else if(hasSel){set(0,'done');set(1,'done');set(2,'done');set(3,'active');}
  else if(hasRes||machRun){set(0,'done');}
}

/* ═══ FX ═══ */
function fxEl(el,t,c){if(!el)return;const r=el.getBoundingClientRect();fxXY(r.left+r.width/2,r.top,t,c);}
function fxXY(x,y,t,c){
  const el=document.createElement('div');el.className='fx';
  el.style.cssText=`left:${x-40}px;top:${y-10}px;color:${c}`;
  el.textContent=t;document.body.appendChild(el);
  setTimeout(()=>el.remove(),1450);
}
function spawnParticles(el,emoji){
  if(!el)return;
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const colors=['#ffc107','#43a047','#1e88e5','#e53935','#ab47bc'];
  for(let i=0;i<7;i++){
    const p=document.createElement('div');p.className='particle';
    const ang=Math.random()*360,dist=40+Math.random()*50;
    const dx=Math.cos(ang*Math.PI/180)*dist,dy=Math.sin(ang*Math.PI/180)*dist;
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${colors[i%colors.length]};--fly:translate(${dx}px,${dy}px);animation-delay:${i*0.04}s`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),950);
  }
}

/* ═══ END ═══ */
function endGame(){
  if(G.ended)return;G.ended=true;G.running=false;clearInterval(G.tick);
  const stars=calcStars();
  S.stars[G.cfg.id]=Math.max(S.stars[G.cfg.id]||0,stars);
  S.coins+=G.coins;
  setTimeout(()=>showResult(stars),600);
}
function goMap(){if(G){G.running=false;clearInterval(G.tick);}show('map');renderMap();}

/* ═══ RESULT ═══ */
function showResult(stars){
  document.getElementById('upg-headline').textContent=
    stars===0?'😔 Попробуй снова':stars===1?'👍 Пройден!':stars===2?'🎉 Отлично!':'🏆 Блестяще!';
  document.querySelectorAll('#upg-stars .s-big').forEach((el,i)=>
    setTimeout(()=>{el.textContent=i<stars?'⭐':'☆';if(i<stars)el.classList.add('on');},i*280));
  document.getElementById('res-pills').innerHTML=`
    <div class="rpill"><div class="rpill-v">🪙${G.coins}</div><div class="rpill-l">Монет</div></div>
    <div class="rpill"><div class="rpill-v">📦${G.ordersOk}</div><div class="rpill-l">Доставлено</div></div>
    <div class="rpill"><div class="rpill-v">❌${G.ordersFailed}</div><div class="rpill-l">Просрочено</div></div>`;
  document.getElementById('upg-wallet').textContent=S.coins;
  buildUpgList();
  const btn=document.getElementById('btn-next');
  if(stars===0){btn.textContent='🔄 Ещё раз';btn.onclick=()=>startLevel(G.cfg.id);}
  else{const nid=G.cfg.id+1,has=LEVELS.find(l=>l.id===nid);btn.textContent=has?'Следующий →':'🗺 На карту';btn.onclick=()=>{show('map');renderMap();};}
  show('upgrade');
}

function buildUpgList(){
  const list=document.getElementById('upg-list');list.innerHTML='';
  list.innerHTML+='<div class="upg-sec">🐾 Животные</div>';
  UPG.forEach((item,idx)=>{
    const lv=S.upg[item.k]||1,maxed=lv>=item.m,cost=UCOSTS[lv],afford=S.coins>=cost;
    const dots=Array.from({length:item.m},(_,i)=>`<div class="udot ${i<lv?'on':''}"></div>`).join('');
    const card=document.createElement('div');
    card.className='upg-card'+(maxed?' off':'')+((!afford&&!maxed)?' broke':'');
    card.innerHTML=`
      <div class="u-ico">${item.e}</div>
      <div class="u-info">
        <div class="u-name">${item.n}</div>
        <div class="u-sub">${item.d} · Lv${lv}${maxed?'':' → '+(lv+1)}</div>
        <div class="u-dots">${dots}</div>
      </div>
      ${maxed?`<div class="u-max-lbl">МАКС ✓</div>`:`<div class="u-cost-btn" style="opacity:${afford?1:.4}"><div class="u-cost-v">🪙${cost}</div><div class="u-cost-l">Купить</div></div>`}`;
    if(!maxed&&afford){
      card.onclick=()=>{
        S.upg[item.k]++;S.coins-=cost;
        document.getElementById('upg-wallet').textContent=S.coins;
        document.getElementById('map-coins').textContent=S.coins;
        buildUpgList();
        fxXY(window.innerWidth*.72,200,'⬆️ '+item.n+' Lv'+(lv+1),'#ffc107');
      };
    }
    list.appendChild(card);
    if(item.k==='field')list.innerHTML+='<div class="upg-sec" style="margin-top:6px">⚙️ Производство и доставка</div>';
  });
}

/* ═══ TUTORIAL ═══ */
const TUT=[
  {t:'paddock',title:'👆 Тапай животных!',text:'Нажми на корову или курицу в загоне — они дадут молоко и яйца для производства.',pos:'right'},
  {t:'barn-widget',title:'📦 Амбар — склад',text:'Всё сырьё хранится в амбаре справа. Следи — не переполни!',pos:'left'},
  {t:'mw-dairy',title:'🏭 Запусти завод!',text:'Тапни здание справа — завод переработает молоко в сыр. 🥛→🧀',pos:'left'},
  {t:'orders-list',title:'📋 Выбери заказ!',text:'Тапни карточку заказа слева. Зелёная рамка = готово к доставке!',pos:'right'},
  {t:'trucks-wrap',title:'🚚 Доставь!',text:'Выбрал заказ? Тапни грузовик — поедет к клиенту и привезёт монеты!',pos:'top'},
];
let tutI=0,tutOv=null;
function runTutorial(done){tutI=0;showTutStep(done);}
function showTutStep(done){
  if(tutOv){tutOv.remove();tutOv=null;}
  if(tutI>=TUT.length){done();return;}
  const step=TUT[tutI];
  const ov=document.createElement('div');ov.className='tut-overlay';tutOv=ov;
  const bg=document.createElement('div');bg.className='tut-bg';ov.appendChild(bg);
  const target=document.getElementById(step.t);
  let tx=window.innerWidth/2-115,ty=window.innerHeight/2-105;
  if(target){
    const r=target.getBoundingClientRect();
    const hl=document.createElement('div');hl.className='tut-highlight';
    hl.style.cssText=`top:${r.top-5}px;left:${r.left-5}px;width:${r.width+10}px;height:${r.height+10}px`;
    ov.appendChild(hl);
    if(step.pos==='right'){tx=r.right+14;ty=r.top+r.height/2-85;}
    else if(step.pos==='left'){tx=r.left-248;ty=r.top+r.height/2-85;}
    else if(step.pos==='top'){tx=r.left+r.width/2-115;ty=r.top-200;}
    tx=Math.max(8,Math.min(window.innerWidth-248,tx));
    ty=Math.max(8,Math.min(window.innerHeight-210,ty));
  }
  const bubble=document.createElement('div');bubble.className='tut-bubble';
  const arr=step.pos==='top'?'👇':step.pos==='right'?'👈':step.pos==='left'?'👉':'👆';
  bubble.innerHTML=`<span class="tut-arrow">${arr}</span><div class="tut-title">${step.title}</div><div class="tut-text">${step.text}</div><button class="tut-ok">${tutI<TUT.length-1?'Понял! →':'Поехали! 🚀'}</button>`;
  bubble.style.cssText=`left:${tx}px;top:${ty}px`;
  bubble.querySelector('.tut-ok').onclick=()=>{tutI++;showTutStep(done);};
  ov.appendChild(bubble);document.body.appendChild(ov);
}

/* ═══ INIT ═══ */
renderMap();show('map');
</script>
